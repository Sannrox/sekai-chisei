[package]
name = "sekai-chisei"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"
description = "Local-first Rust control plane for governed agent operations."
repository = "https://github.com/Sannrox/sekai-chisei"
homepage = "https://github.com/Sannrox/sekai-chisei"
documentation = "https://github.com/Sannrox/sekai-chisei/tree/main/docs"
keywords = ["agents", "governance", "llm", "grpc", "local-first"]
categories = ["development-tools", "web-programming"]

[workspace]
members = [
    "crates/chisei-gateway",
    "crates/sekai-admin-client",
    "crates/sekai-ontology",
    "crates/sekai-proto",
    "crates/sekai-provider",
]
resolver = "2"

[features]
default = []
secret-command = []
gateway-test-support = []

[dependencies]
# gRPC
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
axum = "0.8"
async-stream = "0.3"

# Database
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
postgres = "0.19"
postgres-native-tls = "0.5"
r2d2_postgres = "0.18"
native-tls = "0.2"

# HTTP client (for LLM providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
httpdate = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
same-file = "1"
ed25519-dalek = "2"
hmac = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
sekai-provider = { version = "0.2.1", path = "crates/sekai-provider" }
sekai-admin-client = { version = "0.2.1", path = "crates/sekai-admin-client" }
sekai-proto = { version = "0.2.1", path = "crates/sekai-proto" }

[dev-dependencies]
chisei-gateway = { version = "0.2.1", path = "crates/chisei-gateway" }
tempfile = "3"

[[bench]]
name = "control_plane"
harness = false
