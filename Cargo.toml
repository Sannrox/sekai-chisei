[package]
name = "sekai-chisei"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "Local-first Rust control plane for policy-governed AI-assisted software delivery."

[features]
default = []
secret-command = []

[dependencies]
# gRPC
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
axum = "0.8"
async-stream = "0.3"

# Database
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

# HTTP client (for LLM providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
ed25519-dalek = "2"
hmac = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
pin-project-lite = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
