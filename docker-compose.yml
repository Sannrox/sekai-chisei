services:
  server:
    image: sekai-chisei:${GIT_VERSION}
    volumes:
      - sekai-data:/data
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Combined dest-pair. The image sets SEKAI_DATA_DIR=/data, which derives
      # the same two files; DB_PATH / SEKAI_SHARED_STORE refuse boot.
      - SEKAI_DB_PATH=/data/sekai.db
      - CHISEI_DB_PATH=/data/chisei.db
    # For Linux hosts without native host.docker.internal resolution,
    # use `extra_hosts` together with a reachable Ollama/socket target.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "[ -S /data/sekai.sock ]"]
      interval: 2s
      timeout: 1s
      retries: 30

  gateway:
    image: chisei-gateway:${GIT_VERSION}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - sekai-data:/data
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_BIND=0.0.0.0:8080
      - CHISEI_GATEWAY_POLICY_PATH=/data/chisei-gateway-policy.json
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - CHISEI_GATEWAY_ADMIN_TOKEN=${CHISEI_GATEWAY_ADMIN_TOKEN:?Set CHISEI_GATEWAY_ADMIN_TOKEN for admin endpoint protection}

      # The gateway never calls the control plane. Optional TCP for sekaictl
      # and native clients (not the gateway):
      # On server (credential rows live in the Sekai dest, SEKAI_DB_PATH):
      #   GRPC_PORT: 50051
      # Public 0.0.0.0 TCP also requires TLS certs/key, or SEKAI_ALLOW_PLAINTEXT=1
      # for an explicit trusted plaintext deployment, or SEKAI_BIND=127.0.0.1.
      # Expose server gRPC:
      #   ports:
      #     - "50051:50051"

volumes:
  sekai-data:
