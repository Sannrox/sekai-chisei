name: release

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. Pull
# requests and workflow_dispatch without a tag dry-run the family scripts and
# never mint attestations, push images, or touch a GitHub Release.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dispatch.yml"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/release-package.sh"
      - "scripts/validate-release.sh"
      - "scripts/check-semver.py"
      - "scripts/changelog-draft.sh"
      - "security/release-tag-key.asc"
      - "security/release-tag-fingerprints"
      - "RELEASING.md"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build/release.sh"
      - "build/release-images.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scripts:
    name: Release scripts
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/validate-release.sh
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: needs.verify-tag.outputs.tag != ''
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Public API vs last final tag
        if: needs.verify-tag.outputs.tag != ''
        run: python3 scripts/check-semver.py release

  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh and allowed keys verify the
  # signed tag against the tagged commit's Cargo.toml, and that commit must be
  # on main. A dry run resolves the checked-out commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the signed tag on main
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_ROOT="$PWD" \
            RELEASE_TAG_KEY="${MAIN_TREE}/security/release-tag-key.asc" \
            RELEASE_TAG_FINGERPRINTS="${MAIN_TREE}/security/release-tag-fingerprints" \
            bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only "release not found" or a draft may continue; a token that
          # cannot see drafts reports a draft as not found.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  package:
    name: Family artifacts
    runs-on: ubuntu-latest
    needs: [scripts, verify-tag]
    # release-package.sh reads merged pull requests for the manifest gate flags.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          extra=(--git-sha "$SHA" --skip-build --skip-test)
          if [[ -n "$TAG" ]]; then
            extra+=(--tag "$TAG")
          else
            extra+=(--skip-github)
          fi
          bash scripts/release-package.sh --out dist "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sekai-chisei-release
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.provenance.outputs.attestation-url }}
      sbom-attestation-url: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sekai-chisei-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/sekai-chisei.cdx.json
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/SHA256SUMS
          sbom-path: dist/sekai-chisei.cdx.json

  sekai-release:
    name: Draft GitHub release
    needs: [verify-tag, package, attest]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sekai-chisei-release
          path: dist
      - name: Record attestation URLs on the manifest
        env:
          PROVENANCE_URL: ${{ needs.attest.outputs.attestation-url }}
          SBOM_URL: ${{ needs.attest.outputs.sbom-attestation-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("dist/sekai-chisei-release.json")
          manifest = json.loads(path.read_text())
          urls = [u for u in (os.environ.get("PROVENANCE_URL"), os.environ.get("SBOM_URL")) if u]
          manifest["attestations"] = urls
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > dist/RELEASE_NOTES.md
      - name: Refresh checksums after manifest patch
        run: bash scripts/release-package.sh --out dist --checksums-only
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(
            dist/sekai-chisei.cdx.json
            dist/sekai-chisei-release.json
            dist/SHA256SUMS
          )
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          # A re-run resumes its draft; a published release is never touched.
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)"
          case "$draft" in
            true)
              # Every dispatch rebuilds every asset; drop the earlier run's
              # so a renamed or removed asset is not published.
              gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
                gh release delete-asset "$TAG" "$name" --yes
              done
              gh release upload "$TAG" "${assets[@]}" --clobber
              gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft "${kind[@]}"
              ;;
            absent)
              gh release create "$TAG" "${assets[@]}" \
                --draft \
                --verify-tag \
                "${kind[@]}" \
                --title "$TAG" \
                --notes-file dist/RELEASE_NOTES.md
              ;;
            *)
              echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
              exit 1
              ;;
          esac

  record-image-digest:
    name: Record image digest
    needs: [verify-tag, sekai-release, image-manifest]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the tagged commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch family manifest with image digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          registry="$(printf '%s' "$DOCKER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          version="$(git describe --tags --always --abbrev=14 HEAD)"
          version="${version/+/_}"
          image="${registry}:${version}"
          suffix="${image##*:}"
          if [[ "$suffix" == latest ]]; then
            echo "must not produce a latest image tag" >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/{print $2; exit}')"
          [[ "$digest" == sha256:* ]] || { echo "missing digest for ${image}" >&2; exit 1; }
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern sekai-chisei-release.json
          gh release download "$TAG" --dir dist --pattern sekai-chisei.cdx.json
          IMAGE_NAME="$image" IMAGE_DIGEST="$digest" python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("dist/sekai-chisei-release.json")
          manifest = json.loads(path.read_text())
          name = os.environ["IMAGE_NAME"]
          digest = os.environ["IMAGE_DIGEST"]
          if name.rsplit(":", 1)[-1] == "latest":
              raise SystemExit("images must not use a latest tag")
          if not digest.startswith("sha256:"):
              raise SystemExit("image digest must be sha256:...")
          manifest["images"] = [{"name": name, "digest": digest}]
          dumped = json.dumps(manifest, indent=2, sort_keys=True)
          if "latest" in dumped:
              raise SystemExit("manifest must not mention latest")
          path.write_text(dumped + "\n")
          print(f"image {name} digest {digest}")
          PY
          bash scripts/release-package.sh --out dist --checksums-only
          gh release upload "$TAG" dist/sekai-chisei-release.json dist/SHA256SUMS --clobber
          echo "Image tags: version only, never latest"

  # Publishes last, after every asset job, so a failed asset job leaves a
  # draft that a re-run for the same tag can resume.
  publish:
    name: Publish GitHub Release
    needs: [verify-tag, sekai-release, attest, compatibility-matrix, sekai-binaries, record-image-digest]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
          echo "Published GitHub Release ${TAG} from CHANGELOG"
          echo "Image tags: version only, never latest"

  compatibility-matrix:
    name: Upload compatibility matrix
    needs: [verify-tag, sekai-release]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generate compatibility matrix
        run: cargo run --locked --bin sekaictl -- admin compatibility generate --out compatibility.json
      # CI runs the same check; this one guards the tagged commit itself.
      - name: Check Tenkai products
        run: cargo run --locked --bin sekaictl -- admin compatibility check-tenkai
      - name: Upload compatibility.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: gh release upload "$TAG" compatibility.json --clobber

  sekai-binaries:
    name: sekai (${{ matrix.target }})
    needs: [verify-tag, sekai-release]
    if: needs.verify-tag.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: sekai
          package: sekai-ontology
          target: ${{ matrix.target }}
          ref: refs/tags/${{ needs.verify-tag.outputs.tag }}
          archive: sekai-${{ needs.verify-tag.outputs.tag }}-${{ matrix.target }}
          checksum: sha256
          locked: true
          build-tool: ${{ matrix.build_tool || 'cargo' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    if: needs.verify-tag.outputs.tag != ''
    needs: [verify-tag]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the tagged commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash build/release-images.sh
      - run: bash build/release.sh
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}

  image-manifest:
    needs: [verify-tag, image]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the tagged commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash build/release.sh
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
          RELEASE_MANIFEST: "1"
      - name: Print image digest (version tag only, never latest)
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          registry="$(printf '%s' "$DOCKER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          version="$(git describe --tags --always --abbrev=14 HEAD)"
          version="${version/+/_}"
          digest="$(docker buildx imagetools inspect "${registry}:${version}" --format '{{json .Manifest.Digest}}')"
          echo "image ${registry}:${version} digest ${digest}"
          echo "Image tags: version only, never latest"
