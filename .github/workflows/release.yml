name: release

# Tagged publishes only. Pull requests and workflow_dispatch dry-run the
# family scripts and never mint attestations or a GitHub Release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/release-package.sh"
      - "scripts/validate-release.sh"
      - "scripts/changelog-draft.sh"
      - "security/release-tag-key.asc"
      - "security/release-tag-fingerprints"
      - "RELEASING.md"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build/release.sh"
      - "build/release-images.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/validate-release.sh

  verify-tag:
    name: Verify signed tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Verify annotated signed tag equals workspace version
        run: bash scripts/verify-release-tag.sh verify "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  package:
    name: Family artifacts
    runs-on: ubuntu-latest
    needs: [scripts, verify-tag]
    if: ${{ !cancelled() && needs.scripts.result == 'success' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=(--git-sha "${GITHUB_SHA}" --skip-build --skip-test)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            extra+=(--tag "${GITHUB_REF_NAME}")
          else
            extra+=(--skip-github)
          fi
          bash scripts/release-package.sh --out dist "${extra[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sekai-chisei-release
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.provenance.outputs.attestation-url }}
      sbom-attestation-url: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sekai-chisei-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/sekai-chisei.cdx.json
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/SHA256SUMS
          sbom-path: dist/sekai-chisei.cdx.json

  sekai-release:
    name: Draft GitHub release
    needs: [verify-tag, package, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sekai-chisei-release
          path: dist
      - name: Record attestation URLs on the manifest
        env:
          PROVENANCE_URL: ${{ needs.attest.outputs.attestation-url }}
          SBOM_URL: ${{ needs.attest.outputs.sbom-attestation-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("dist/sekai-chisei-release.json")
          manifest = json.loads(path.read_text())
          urls = [u for u in (os.environ.get("PROVENANCE_URL"), os.environ.get("SBOM_URL")) if u]
          manifest["attestations"] = urls
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > dist/RELEASE_NOTES.md
      - name: Refresh checksums after manifest patch
        run: bash scripts/release-package.sh --out dist --checksums-only
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            dist/sekai-chisei.cdx.json
            dist/sekai-chisei-release.json
            dist/SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft
          else
            gh release create "$TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "$TAG" \
              --notes-file dist/RELEASE_NOTES.md
          fi

  record-image-digest:
    name: Record image digest
    needs: [sekai-release, image-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch family manifest with image digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          registry="$(printf '%s' "$DOCKER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          version="$(git describe --tags --always --abbrev=14 HEAD)"
          version="${version/+/_}"
          image="${registry}:${version}"
          suffix="${image##*:}"
          if [[ "$suffix" == latest ]]; then
            echo "must not produce a latest image tag" >&2
            exit 1
          fi
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/{print $2; exit}')"
          [[ "$digest" == sha256:* ]] || { echo "missing digest for ${image}" >&2; exit 1; }
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern sekai-chisei-release.json
          gh release download "$TAG" --dir dist --pattern sekai-chisei.cdx.json
          IMAGE_NAME="$image" IMAGE_DIGEST="$digest" python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("dist/sekai-chisei-release.json")
          manifest = json.loads(path.read_text())
          name = os.environ["IMAGE_NAME"]
          digest = os.environ["IMAGE_DIGEST"]
          if name.rsplit(":", 1)[-1] == "latest":
              raise SystemExit("images must not use a latest tag")
          if not digest.startswith("sha256:"):
              raise SystemExit("image digest must be sha256:...")
          manifest["images"] = [{"name": name, "digest": digest}]
          dumped = json.dumps(manifest, indent=2, sort_keys=True)
          if "latest" in dumped:
              raise SystemExit("manifest must not mention latest")
          path.write_text(dumped + "\n")
          print(f"image {name} digest {digest}")
          PY
          bash scripts/release-package.sh --out dist --checksums-only
          gh release upload "$TAG" dist/sekai-chisei-release.json dist/SHA256SUMS --clobber
          echo "Image tags: version only, never latest"

  publish:
    name: Publish GitHub Release
    needs: [sekai-release, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published GitHub Release ${TAG} from CHANGELOG"
          echo "Image tags: version only, never latest"

  compatibility-matrix:
    name: Upload compatibility matrix
    needs: sekai-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Generate compatibility matrix
        run: cargo run --locked --bin sekaictl -- admin compatibility generate --out compatibility.json
      - name: Upload compatibility.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" compatibility.json --clobber

  sekai-binaries:
    name: sekai (${{ matrix.target }})
    needs: sekai-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: sekai
          package: sekai-ontology
          target: ${{ matrix.target }}
          archive: sekai-${{ github.ref_name }}-${{ matrix.target }}
          checksum: sha256
          locked: true
          build-tool: ${{ matrix.build_tool || 'cargo' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash build/release-images.sh
      - run: bash build/release.sh
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}

  image-manifest:
    needs: [verify-tag, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash build/release.sh
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
          RELEASE_MANIFEST: "1"
      - name: Print image digest (version tag only, never latest)
        env:
          DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          registry="$(printf '%s' "$DOCKER_REGISTRY" | tr '[:upper:]' '[:lower:]')"
          version="$(git describe --tags --always --abbrev=14 HEAD)"
          version="${version/+/_}"
          digest="$(docker buildx imagetools inspect "${registry}:${version}" --format '{{json .Manifest.Digest}}')"
          echo "image ${registry}:${version} digest ${digest}"
          echo "Image tags: version only, never latest"
