name: Security Audit

# Pull requests do not run the audit: a new advisory arrives through the feed,
# not the diff, so a pull-request run failed unrelated changes for advisories
# already on main (#2576). The push run below and Dependabot alerts report an
# advisory that a merge adds.
on:
  push:
    branches: [main, "release-*"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "27 4 * * 1"

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
