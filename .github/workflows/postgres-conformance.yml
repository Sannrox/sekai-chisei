name: PostgreSQL conformance

# Runs the ignored PostgreSQL conformance suites against an ephemeral TLS-only
# PostgreSQL (#1153). Community PostgreSQL defects do not show up in the
# default SQLite test run, so every pull request runs these too (#1316).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-conformance:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/postgres-conformance.sh
