name: PostgreSQL conformance

# Runs the ignored PostgreSQL conformance suites against an ephemeral TLS-only
# PostgreSQL (#1153). Community PostgreSQL defects do not show up in the
# default SQLite test run, so every pull request runs these too (#1316).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-conformance:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bash scripts/postgres-conformance.sh
