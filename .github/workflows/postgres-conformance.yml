name: PostgreSQL conformance

# Runs the ignored PostgreSQL conformance suites against an ephemeral TLS-only
# PostgreSQL (#1153). Community PostgreSQL defects do not show up in the
# default SQLite test run, so every pull request that changes a non-docs path
# runs these too (#1316). A docs-only change cannot add a SQLite-only surface,
# and the parity docs are checked by Build & Test (#2571).
on:
  push:
    branches: [main, "release-*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every other run gets
# its own group, so main, release, scheduled, and manual runs never cancel or
# replace one another (#2809).
concurrency:
  group: postgres-conformance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-conformance:
    name: PostgreSQL conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Main writes this cache from reviewed code, and the job publishes nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]
      - run: bash scripts/postgres-conformance.sh
