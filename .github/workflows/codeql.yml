name: CodeQL

on:
  push:
    branches: [main, "release-*"]
  # A docs-only pull request skips the scan (#2571); main and the schedule scan everything.
  pull_request:
    branches: [main, "release-*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  schedule:
    - cron: "27 4 * * 1"

jobs:
  # Rust is the server; Python is the release tooling under scripts/ (run with
  # release credentials) and the client SDK under sdk/python/ (#2808).
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache dependencies
        if: matrix.language == 'rust'
        # Main writes this cache from reviewed code, and the job publishes nothing.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 # zizmor: ignore[cache-poisoning]

      - name: Initialize CodeQL
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust

      - name: Initialize CodeQL (python)
        if: matrix.language == 'python'
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          build-mode: none

      - name: Autobuild
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
