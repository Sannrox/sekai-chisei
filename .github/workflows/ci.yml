name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt-check
      - run: cargo clippy-all
      - run: cargo test-all
      - run: ./scripts/validate-ontology-deps.sh
      - run: ./build/release-images.sh
      - run: docker run --rm "$(cat _output/image-tag)" sekaictl --help
