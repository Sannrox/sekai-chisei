name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

# A new push to a pull request cancels its previous run; main runs every push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pull request paths that need the optional lanes; a change elsewhere is
  # still checked by the run on main.
  IMAGE_PATHS: '^(build/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
  TEMPLATE_PATHS: '^(crates/(sekai-connector-template|sekai-source-sdk|sekai-types|sekai-proto)/|src/connector_template\.rs$|scripts/check-connector-template\.sh$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'

jobs:
  # Whether a pull request needs the image lane. Pushes to main and scheduled
  # runs take every lane, so anything a path filter misses is caught there.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$IMAGE_PATHS"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo fmt-check
      - run: sh scripts/adr-index.sh --check

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    # Runs agent-kit main by design (no pin); keep the token read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-workflow-skills.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy-all

  # Required check: it computes its own scope rather than needing `changes`,
  # because a required job skipped after a failed dependency reads as passed.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test-all
      - run: cargo run -p sekai-source-sdk --example out_of_tree_adapter --locked
      - run: bash scripts/check-source-sdk-api.sh
      # Reuses this job's target directory, so it stays here.
      - id: template
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$TEMPLATE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.template.outputs.run == 'true'
        run: bash scripts/check-connector-template.sh
      - run: bash scripts/validate-ontology-deps.sh

  # Not a required check: it runs beside Build & Test, not after it.
  images:
    name: Release images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: bash build/release-images.sh
      - run: docker run --rm "$(cat _output/image-tag)" sekaictl --help

  # Public API of the library crates against the pull request base. Versions
  # are release-owned, so a pull request never bumps them: a reported break
  # passes only when the pull request is marked breaking (`type!:` subject or
  # a Breaking/Upgrade heading, as scripts/changelog-draft.sh reads it) and
  # labelled `risk:breaking`, which the release manifest turns into a gate.
  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # rust-toolchain.toml picks the version.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # Bump with the toolchain: each release reads a range of rustdoc JSON formats.
          tool: cargo-semver-checks@0.51.0
      - name: cargo-semver-checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Every workspace library crate, so a new crate is covered without editing this list.
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          mapfile -t packages < <(jq -r '.packages[] | select(any(.targets[]; .kind | index("lib"))) | .name' <<<"$metadata")
          # One run per package: only a package that reports a break can be
          # waived; a tool or build failure in any package stays red.
          broken=()
          for package in "${packages[@]}"; do
            # A crate added by this pull request has no baseline to compare.
            manifest="$(jq -r --arg p "$package" '.packages[] | select(.name == $p) | .manifest_path' <<<"$metadata")"
            if ! git cat-file -e "${BASE}:${manifest#"$PWD"/}" 2>/dev/null; then
              echo "::notice::${package} is new in this pull request; no baseline to check."
              continue
            fi
            rc=0
            out="$(cargo semver-checks --package "$package" --baseline-rev "$BASE" 2>&1)" || rc=$?
            echo "$out"
            [[ $rc -eq 0 ]] && continue
            if grep -qE 'semver requires new major version' <<<"$out"; then
              broken+=("$package")
            elif grep -qE 'semver requires new minor version' <<<"$out"; then
              # The unchanged version reads as a patch release, so compatible
              # additions such as deprecations report "minor"; they pass.
              echo "::notice::${package}: minor-level API change (compatible)."
            else
              echo "::error::cargo-semver-checks failed for ${package} without reporting an API break; see the log."
              exit "$rc"
            fi
          done
          [[ ${#broken[@]} -eq 0 ]] && exit 0
          echo "API break reported in: ${broken[*]}"
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Public API break accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::cargo-semver-checks found a public API break. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1
