name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

# A new push to a pull request cancels its previous run; main runs every push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pull request paths that need the optional lanes; a change elsewhere is
  # still checked by the run on main.
  IMAGE_PATHS: '^(build/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
  TEMPLATE_PATHS: '^(crates/(sekai-connector-template|sekai-source-sdk|sekai-types|sekai-proto)/|src/connector_template\.rs$|scripts/check-connector-template\.sh$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'

jobs:
  # Whether a pull request needs the image lane. Pushes to main and scheduled
  # runs take every lane, so anything a path filter misses is caught there.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$IMAGE_PATHS"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo fmt-check
      - run: sh scripts/adr-index.sh --check

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    # Runs agent-kit main by design (no pin); keep the token read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-workflow-skills.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy-all

  # Required check: it computes its own scope rather than needing `changes`,
  # because a required job skipped after a failed dependency reads as passed.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test-all
      - run: cargo run -p sekai-source-sdk --example out_of_tree_adapter --locked
      - run: bash scripts/check-source-sdk-api.sh
      # Reuses this job's target directory, so it stays here.
      - id: template
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -Eq "$TEMPLATE_PATHS"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.template.outputs.run == 'true'
        run: bash scripts/check-connector-template.sh
      - run: bash scripts/validate-ontology-deps.sh

  # Proto compatibility against the pull request base and the last final v*
  # tag (proto/buf.yaml sets the rules). A break vs the base passes only when
  # the pull request is marked breaking (`type!:` subject or a Breaking/Upgrade
  # heading, as scripts/changelog-draft.sh reads it) and labelled
  # `risk:breaking`. A break vs the tag that is already on the base is a
  # notice, as in scripts/check-semver.py. A tool failure stays red.
  proto-breaking:
    name: Proto breaking
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Install buf with retries: one release-download 504 must not fail the
      # job before buf runs (#2174). The pinned checksum fixes the binary.
      - name: Install buf
        env:
          BUF_VERSION: 1.75.0
          BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/buf/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$bin/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $bin/buf" | sha256sum -c -
          chmod +x "$bin/buf"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/buf" --version
      - name: buf breaking
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$BASE" 2>/dev/null || true)"
          # buf exits 100 for reported incompatibilities; anything else is a tool error.
          breaking() {
            local rc=0
            buf breaking proto --against "$1" "${@:2}" 2>&1 || rc=$?
            if [[ $rc -ne 0 && $rc -ne 100 ]]; then
              echo "::error::buf breaking failed without reporting a break (exit ${rc}); see the log."
              exit "$rc"
            fi
            return "$rc"
          }
          if ! git cat-file -e "${BASE}:proto" 2>/dev/null; then
            echo "::notice::The pull request base has no proto/ directory; nothing to compare against."
            exit 0
          fi
          if breaking ".git#ref=${BASE},subdir=proto" --error-format github-actions; then
            # Compatible with the base. A break against the tag is then already on the
            # base: report it, release prep owns the major.
            if [[ -n "$tag" ]] && git cat-file -e "${tag}:proto" 2>/dev/null; then
              echo "::group::buf breaking against ${tag}"
              rc=0
              breaking ".git#tag=${tag},subdir=proto" || rc=$?
              echo "::endgroup::"
              if [[ $rc -eq 100 ]]; then
                echo "::notice::Proto break against ${tag} (already on the pull request base; release prep must cut a major)."
              fi
            fi
            exit 0
          fi
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Proto break against the pull request base accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::buf breaking found incompatible proto changes against the pull request base. Mark the pull request breaking (a 'type!:' title or a '### Breaking' heading) and add the risk:breaking label, or keep the change compatible."
          exit 1

  # Not a required check: it runs beside Build & Test, not after it.
  images:
    name: Release images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: bash build/release-images.sh
      - run: docker run --rm "$(cat _output/image-tag)" sekaictl --help

  # Public API of the library crates against the pull request base and the
  # last final v* tag (scripts/check-semver.py). Versions are release-owned,
  # so a pull request never bumps them: a reported major vs the base passes
  # only when the pull request is marked breaking (`type!:` subject or a
  # Breaking/Upgrade heading, as scripts/changelog-draft.sh reads it) and
  # labelled `risk:breaking`. A major vs the tag that is already on the base
  # is a notice; release prep is the version bump. New public enums need
  # #[non_exhaustive].
  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # rust-toolchain.toml picks the version.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          # Bump with the toolchain: each release reads a range of rustdoc JSON formats.
          tool: cargo-semver-checks@0.51.0
      - name: cargo-semver-checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-semver.py pr
