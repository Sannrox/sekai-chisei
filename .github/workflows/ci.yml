name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Verify standalone ontology dependencies
        shell: bash
        run: |
          set -euo pipefail
          dependency_tree="$(cargo tree -p sekai-ontology --edges normal --prefix none)"
          for forbidden in tonic tonic-prost tonic-health postgres reqwest axum; do
            if grep -Eq "^${forbidden} v" <<<"$dependency_tree"; then
              echo "standalone ontology package includes forbidden dependency: $forbidden" >&2
              exit 1
            fi
          done

      - name: Measure standalone ontology cold start
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(date +%s%N)"
          for _ in {1..20}; do target/debug/sekai --help >/dev/null; done
          elapsed_ns="$(( $(date +%s%N) - start_ns ))"
          average_ms="$(( elapsed_ns / 20000000 ))"
          echo "sekai average cold-start subprocess time: ${average_ms} ms"
          test "$average_ms" -lt 250

      - name: Test
        run: cargo test --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets -- -D warnings

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Docker inputs
        id: docker-inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          if grep -Eq '^(Dockerfile|Cargo\.lock|Cargo\.toml|proto/|src/)' <<<"$changed_files"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.docker-inputs.outputs.should_run == 'true'
        run: docker build -t sekai-chisei-ci .

      - name: Verify sekaictl is packaged
        if: steps.docker-inputs.outputs.should_run == 'true'
        run: docker run --rm sekai-chisei-ci sekaictl --help

  gateway-smoke:
    name: Gateway Smoke
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build smoke binaries
        run: cargo build --locked --bins

      - name: Run gateway smoke
        env:
          CHISEI_GATEWAY_SMOKE_SKIP_BUILD: "1"
        run: scripts/chisei_gateway_smoke.sh
