[package]
name = "sekai-provider"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Provider contracts and adapters shared by Sekai Chisei transports."

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
