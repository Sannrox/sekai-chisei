[package]
name = "sekai-change-capture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Sandboxed change-capture child the connector runtime starts per capture Source (ADR 0170)."
publish = false

# The sandbox dependencies live only here: the connector runtime starts
# this child and never applies a sandbox to itself.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
