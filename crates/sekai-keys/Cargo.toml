[package]
name = "sekai-keys"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Customer-managed key hierarchy and key-provider contract for stores."

[dependencies]
aes-gcm = "0.11"
rand = { version = "0.8", features = ["std"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
