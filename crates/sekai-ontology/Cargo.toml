[package]
name = "sekai-ontology"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Portable SQLite ontology library and the sekai command-line tool."

[lib]
name = "sekai_ontology"

[[bin]]
name = "sekai"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
