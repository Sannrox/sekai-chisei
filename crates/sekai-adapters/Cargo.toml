[package]
name = "sekai-adapters"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reference evidence adapters and gRPC client examples for Sekai Chisei."
publish = false

# Depends on the wire contract and the admin client only, never on the root
# package, so a root edit does not rebuild these examples and tests.
[dependencies]
chrono = "0.4"
prost = "0.14"
sekai-admin-client = { version = "1.0.0", path = "../sekai-admin-client" }
sekai-proto = { version = "3.0.0", path = "../sekai-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
tonic = "0.14"
