[package]
name = "ezu-adapter"
version = "3.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Host process for the Ezu adapter: geo feeds and fence Actions."
publish = false

[[bin]]
name = "ezu-adapter"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sekai-proto = { version = "3.0.0", path = "../sekai-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "channel",
    "tls-ring",
    "tls-native-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
