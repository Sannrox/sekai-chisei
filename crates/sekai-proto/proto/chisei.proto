// --- Host-executed external-action authorization ---
// These contracts describe bounded authority and causal evidence. Chisei does
// not execute host actions, and v1 authorization decisions do not issue a
// signed permit; permit issuance is a separate protocol stage.
message ExternalActionRequest {
  string version = 1; // external-action.request/v1
  string operation_id = 2;
  string parent_operation_id = 3;
  string attempt_id = 4;
  string request_id = 5;
  string actor = 6; // must match the authenticated principal
  string namespace = 7;
  string requesting_harness = 8;
  string intended_executor = 9;
  string action_type = 10;
  string parameter_schema = 11;
  string canonical_arguments_digest = 12;
  map<string, string> policy_summary = 13; // classified, policy-inspectable fields only
  repeated string target_selectors = 14;
  map<string, string> immutable_preconditions = 15;
  string risk_class = 16; // read | write | destructive
  repeated string expected_effects = 17;
  uint32 requested_invocation_count = 18;
  int64 deadline_ms = 19;
  uint64 estimated_cost_micros = 20;
  uint64 estimated_volume = 21;
  uint32 affected_resource_count = 22;
  string rollback_capability = 23;
  repeated string required_host_capabilities = 24;
  string idempotency_key = 25;
  string policy_project = 26; // canonical project scope used for policy resolution
}

message ExternalActionAssuranceDeclaration {
  string version = 1; // external-action.assurance/v1
  bool authorization_only = 2;
  bool host_must_verify_permit = 3;
  bool host_must_enforce_constraints = 4;
  bool physical_effect_verified = 5;
}

message ExternalActionPermit {
  string version = 1; // external-action.permit/v1
  string permit_id = 2;
  string authorization_id = 3;
  string request_digest = 4;
  bytes signature = 5;
  int64 expires_at_ms = 6;
  repeated string constraints = 7;
  string issuer = 8;
  string subject_actor = 9;
  string namespace = 10;
  string operation_id = 11;
  string requesting_harness = 12;
  string executor = 13;
  string action_type = 14;
  string parameter_schema = 15;
  string canonical_arguments_digest = 16;
  repeated string target_selectors = 17;
  map<string, string> immutable_preconditions = 18;
  repeated string allowed_effects = 19;
  string risk_class = 20;
  uint64 budget_micros = 21;
  uint64 volume_limit = 22;
  uint32 blast_radius_limit = 23;
  uint32 max_invocations = 24;
  int64 not_before_ms = 25;
  string redemption_mode = 26;
  repeated string approval_identities = 27;
  string policy_version = 28;
  string schema_version = 29;
  string capability_version = 30;
  string pricing_version = 31;
  string nonce = 32;
  uint32 delegation_depth = 33;
  string parent_permit_id = 34;
  string revocation_handle = 35;
  string signature_algorithm = 36;
  string key_id = 37;
  string signed_digest = 38;
  string public_key = 39;
  int64 issued_at_ms = 40;
  int64 revocation_latency_ms = 41;
  repeated string required_host_capabilities = 42;
  repeated string parent_chain = 43; // ordered root-to-immediate-parent permit ids
  string initiating_actor = 44; // immutable actor that began the chain
  bool offline_revocation_unavailable = 45;
  string policy_scope = 46;
  // Region/site pin for online redeem (#293). Empty means default "local".
  string site_id = 47;
}

message ExternalActionRedemption {
  string version = 1; // external-action.redemption/v1
  string permit_id = 2;
  string redemption_id = 3;
  string executor = 4;
  int64 redeemed_at_ms = 5;
  uint32 invocation_ordinal = 6;
  int64 evidence_due_at_ms = 7; // terminal host evidence deadline from the signed permit window
  // Site pin that performed the redeem (#293).
  string site_id = 8;
}

message ExternalActionEvidence {
  string version = 1; // external-action.evidence/v1
  string authorization_id = 2;
  string permit_id = 3;
  string redemption_id = 4;
  string evidence_submission_id = 5;
  string observed_outcome_digest = 6;
  string observer = 7;
  string execution_id = 8;
  string lifecycle_state = 9; // accepted | started | completed | failed | cancelled | outcome_unknown
  int64 observed_at_ms = 10;
  optional int64 started_at_ms = 11;
  optional int64 finished_at_ms = 12;
  map<string, string> enforced_preconditions = 13;
  repeated string normalized_effects = 14;
  repeated string affected_resource_references = 15;
  uint64 cost_micros = 16;
  map<string, uint64> resource_use = 17;
  repeated string artifact_hashes = 18;
  string exit_classification = 19;
  string error_classification = 20;
  repeated string compensation_evidence_hashes = 21;
  string host_schema_version = 22;
  string host_software_version = 23;
}

message ExternalActionDecision {
  string version = 1; // external-action.decision/v1
  string authorization_id = 2;
  string request_digest = 3;
  string decision = 4; // deny | require_approval | permit
  string reason = 5;
  string approval_id = 6;
  string policy_scope = 7;
  string policy_version = 8;
  int64 created_at_ms = 9;
  int64 expires_at_ms = 10;
  int64 cancelled_at_ms = 11;
  ExternalActionAssuranceDeclaration assurance = 12;
  ExternalActionPermit permit = 13;
}

message AuthorizeExternalActionRequest { ExternalActionRequest request = 1; }
message AuthorizeExternalActionResponse { ExternalActionDecision decision = 1; }
message ResolveExternalActionApprovalRequest {
  string authorization_id = 1;
  bool approve = 2;
  string reason = 3;
}
message ResolveExternalActionApprovalResponse { ExternalActionDecision decision = 1; }
message CancelExternalActionAuthorizationRequest {
  string authorization_id = 1;
  string reason = 2;
}
message CancelExternalActionAuthorizationResponse { ExternalActionDecision decision = 1; }
message IssueExternalActionPermitRequest {
  string authorization_id = 1;
  string idempotency_key = 2;
  bool offline = 3; // requires explicit action eligibility in stored permit policy
}
message IssueExternalActionPermitResponse { ExternalActionPermit permit = 1; }
message VerifyExternalActionPermitRequest {
  ExternalActionPermit permit = 1;
  string executor = 2;
  string requesting_harness = 3;
  string canonical_arguments_digest = 4;
  repeated string target_selectors = 5;
  map<string, string> observed_preconditions = 6;
  repeated string host_capabilities = 7;
}
message VerifyExternalActionPermitResponse { bool valid = 1; string reason = 2; }
message RedeemExternalActionPermitRequest {
  ExternalActionPermit permit = 1;
  string executor = 2;
  string requesting_harness = 3;
  string canonical_arguments_digest = 4;
  repeated string target_selectors = 5;
  map<string, string> observed_preconditions = 6;
  repeated string host_capabilities = 7;
  string idempotency_key = 8;
  string execution_id = 9;
  int64 invoked_at_ms = 10; // required for offline reconciliation; zero for online pre-execution redemption
}
message RedeemExternalActionPermitResponse { ExternalActionRedemption redemption = 1; }
message RevokeExternalActionPermitRequest { string revocation_handle = 1; string reason = 2; }
message RevokeExternalActionPermitResponse { bool revoked = 1; }
message SetExternalActionKillSwitchRequest {
  string scope_kind = 1; // action_type | executor | harness | namespace | signing_key
  string scope_value = 2;
  bool enabled = 3;
  string reason = 4;
}
message SetExternalActionKillSwitchResponse { bool changed = 1; }
message ExternalPermitPolicy {
  string scope = 1;
  repeated string offline_action_types = 2;
  int64 offline_max_duration_ms = 3;
  uint32 offline_max_invocations = 4;
  repeated string permitted_delegators = 5;
  uint32 max_delegation_depth = 6;
}
message SetExternalPermitPolicyRequest { ExternalPermitPolicy policy = 1; }
message SetExternalPermitPolicyResponse { ExternalPermitPolicy policy = 1; }
message DelegateExternalActionPermitRequest {
  ExternalActionPermit parent = 1;
  string subject_actor = 2;
  repeated string target_selectors = 3;
  repeated string allowed_effects = 4;
  uint64 budget_micros = 5;
  uint64 volume_limit = 6;
  uint32 blast_radius_limit = 7;
  uint32 max_invocations = 8;
  int64 expires_at_ms = 9;
  string risk_class = 10;
}
message DelegateExternalActionPermitResponse { ExternalActionPermit permit = 1; }

// --- Governed immutable-subject evaluation ---
// The core envelope contains identifiers and digests only. Registered profile
// adapters validate domain fields before constructing this payload.
message GovernedSubjectReference {
  string kind = 1;
  string reference = 2;
  string content_digest = 3;
  int64 observed_at_ms = 4;
}
message GovernedSubjectEnvelope {
  string version = 1; // chisei.governed-subject/v1
  string namespace = 2;
  string request_id = 3;
  string subject_profile = 4;
  string subject_identity = 5;
  string content_digest = 6;
  repeated GovernedSubjectReference references = 7;
  string evaluation_profile = 8;
}
message EvaluateGovernedSubjectRequest { GovernedSubjectEnvelope subject = 1; }
message GovernedSubjectResult {
  string version = 1; // chisei.governed-subject-result/v1
  string decision = 2; // allow | deny | unavailable | unknown
  string operation_id = 3;
  string receipt_schema = 4;
  string receipt_digest = 5;
  repeated GovernedSubjectReference references = 6;
  bool fresh = 7;
  string failure_code = 8;
  string failure_message = 9;
}
message EvaluateGovernedSubjectResponse { GovernedSubjectResult result = 1; }

// Authenticated evidence export for Tenkai's single compiled governed-subject
// admission profile. This is not an arbitrary receipt-signing API.
message ExportGovernedSubjectProvenanceRequest {
  string export_id = 1;
  string operation_id = 2;
  string expected_subject_identity = 3;
  string expected_manifest_digest = 4;
  string expected_artifact_digest = 5;
  string expected_receipt_digest = 6;
  string expected_subject_content_digest = 7;
}
message GovernedSubjectProvenanceReference {
  string kind = 1;
  string id = 2;
  string digest = 3;
}
message GovernedSubjectProvenanceEnvelope {
  string profile = 1; // example.governed-subject-receipt/v1
  string issuer = 2; // sekai-chisei
  string issuer_key_id = 3;
  string subject = 4;
  string content_digest = 5;
  string decision = 6; // allow
  string receipt_schema = 7; // chisei.governed-subject-receipt/v1
  string receipt_digest = 8;
  repeated GovernedSubjectProvenanceReference governed_references = 9;
  int64 observed_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  string signature = 12;
}
message ExportGovernedSubjectProvenanceResponse {
  GovernedSubjectProvenanceEnvelope envelope = 1;
  string envelope_digest = 2;
  bool replayed = 3;
}
message GetGovernedSubjectProvenanceTrustRootRequest {
  string export_id = 1;
}
message GovernedSubjectProvenanceTrustRoot {
  uint32 version = 1;
  string key_id = 2;
  string identity = 3;
  string public_key = 4;
}
message GetGovernedSubjectProvenanceTrustRootResponse {
  GovernedSubjectProvenanceTrustRoot trust_root = 1;
}

// Additive plan-backed path for software release candidates. The exact
// subject profile selects situation-specific plan and evaluator semantics;
// existing governed-subject/v1 profile strings are never reinterpreted.
message PlanBackedGovernedSubjectEvaluation {
  string contract_version = 1; // chisei.plan-backed-governed-subject-evaluation/v1
  string namespace = 2;
  string request_id = 3;
  string subject_profile = 4; // example.software-release-candidate/v2
  string subject_identity = 5;
  string subject_content_digest = 6;
  string plan_version_id = 7;
  repeated string evidence_object_ids = 8;
  int64 evaluation_time_ms = 9;
  uint64 max_total_duration_ms = 10;
}
message EvaluateGovernedSubjectWithPlanRequest {
  PlanBackedGovernedSubjectEvaluation evaluation = 1;
}
message PlanBackedGovernedSubjectDecision {
  string contract_version = 1; // chisei.plan-backed-governed-subject-decision/v1
  string decision = 2; // allow | deny | unavailable | unknown
  string operation_id = 3;
  string receipt_schema = 4;
  string receipt_digest = 5;
  string plan_version_id = 6;
  string plan_digest = 7;
  string manifest_id = 8;
  string manifest_digest = 9;
  string invariant_set_id = 10;
  string invariant_set_digest = 11;
  string execution_operation_id = 12;
  string gate_decision_digest = 13;
  repeated string covered_invariant_version_ids = 14;
  repeated string waived_invariant_version_ids = 15;
  repeated string uncovered_invariant_version_ids = 16;
  repeated string step_receipt_digests = 17;
  string failure_code = 18;
}
message EvaluateGovernedSubjectWithPlanResponse {
  PlanBackedGovernedSubjectDecision decision = 1;
}

// --- Service ---

// Governed decisions for agent operations: context, policy, budgets, routing,
// evaluation, approvals, and learning. Agent runtimes remain replaceable
// clients of this service.
service ChiseiService {
  rpc EvaluateGovernedSubject(EvaluateGovernedSubjectRequest) returns (EvaluateGovernedSubjectResponse);
  rpc ExportGovernedSubjectProvenance(ExportGovernedSubjectProvenanceRequest) returns (ExportGovernedSubjectProvenanceResponse);
  rpc GetGovernedSubjectProvenanceTrustRoot(GetGovernedSubjectProvenanceTrustRootRequest) returns (GetGovernedSubjectProvenanceTrustRootResponse);
  rpc EvaluateGovernedSubjectWithPlan(EvaluateGovernedSubjectWithPlanRequest) returns (EvaluateGovernedSubjectWithPlanResponse);
  rpc ExecuteEvaluationManifest(ExecuteEvaluationManifestRequest) returns (ExecuteEvaluationManifestResponse);
  rpc GetEvaluationExecution(GetEvaluationExecutionRequest) returns (GetEvaluationExecutionResponse);
  rpc CancelEvaluationExecution(CancelEvaluationExecutionRequest) returns (CancelEvaluationExecutionResponse);
  rpc AuthorizeExternalAction(AuthorizeExternalActionRequest) returns (AuthorizeExternalActionResponse);
  rpc ResolveExternalActionApproval(ResolveExternalActionApprovalRequest) returns (ResolveExternalActionApprovalResponse);
  rpc CancelExternalActionAuthorization(CancelExternalActionAuthorizationRequest) returns (CancelExternalActionAuthorizationResponse);
  rpc IssueExternalActionPermit(IssueExternalActionPermitRequest) returns (IssueExternalActionPermitResponse);
  rpc VerifyExternalActionPermit(VerifyExternalActionPermitRequest) returns (VerifyExternalActionPermitResponse);
  rpc RedeemExternalActionPermit(RedeemExternalActionPermitRequest) returns (RedeemExternalActionPermitResponse);
  rpc RevokeExternalActionPermit(RevokeExternalActionPermitRequest) returns (RevokeExternalActionPermitResponse);
  rpc SetExternalActionKillSwitch(SetExternalActionKillSwitchRequest) returns (SetExternalActionKillSwitchResponse);
  rpc SetExternalPermitPolicy(SetExternalPermitPolicyRequest) returns (SetExternalPermitPolicyResponse);
  rpc DelegateExternalActionPermit(DelegateExternalActionPermitRequest) returns (DelegateExternalActionPermitResponse);
  // Budget
  rpc CheckBudget(CheckBudgetRequest) returns (CheckBudgetResponse);
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);
  rpc SetBudgetLimit(SetBudgetLimitRequest) returns (SetBudgetLimitResponse);
  // Single fat decide for gateway PEP thinning (Issue #163).
  rpc DecideGatewayExecution(DecideGatewayExecutionRequest) returns (DecideGatewayExecutionResponse);

  // Intelligence portfolio
  rpc RecordPortfolioObservation(RecordPortfolioObservationRequest) returns (RecordPortfolioObservationResponse);
  rpc GetPortfolioFrontier(GetPortfolioFrontierRequest) returns (GetPortfolioFrontierResponse);
  rpc SetPortfolioObjective(SetPortfolioObjectiveRequest) returns (SetPortfolioObjectiveResponse);
  rpc AllocatePortfolio(AllocatePortfolioRequest) returns (AllocatePortfolioResponse);

  // Model Policy
  rpc SetNamespacePolicy(SetNamespacePolicyRequest) returns (SetNamespacePolicyResponse);
  rpc ResolvePolicy(ResolvePolicyRequest) returns (ResolvePolicyResponse);
  // Read-only historical dry-run of a candidate policy over stored receipts.
  rpc DryRunNamespacePolicy(DryRunNamespacePolicyRequest) returns (DryRunNamespacePolicyResponse);
  // Read-only, operator-safe live projection of effective namespace policy.
  rpc GetEffectivePolicySummary(GetEffectivePolicySummaryRequest) returns (GetEffectivePolicySummaryResponse);
  // Compact namespace-authorized projection of the governed routing availability map.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse);
  rpc SetNamespaceWorkerPolicy(SetNamespaceWorkerPolicyRequest) returns (SetNamespaceWorkerPolicyResponse);
  rpc CheckEgress(CheckEgressRequest) returns (CheckEgressResponse);

  // Pipeline
  rpc RunPipeline(RunPipelineRequest) returns (RunPipelineResponse);
  rpc ListPipelineRuns(ListPipelineRunsRequest) returns (ListPipelineRunsResponse);
  rpc RecordSampleObservation(RecordSampleObservationRequest) returns (RecordSampleObservationResponse);
  rpc RecordGatewayAudit(RecordGatewayAuditRequest) returns (RecordGatewayAuditResponse);
  // Native governed entry path. Planning resolves policy, context, routing,
  // budget, and evaluation state before a provider call is allowed.
  rpc PlanExecution(PlanExecutionRequest) returns (PlanExecutionResponse);
  // Executes a previously governed plan through the selected provider adapter.
  rpc ExecutePlan(ExecutePlanRequest) returns (ExecutePlanResponse);
  rpc ExecutePlanStream(ExecutePlanRequest) returns (stream ExecutePlanStreamEvent);
  rpc ReportOperationEvent(ReportOperationEventRequest) returns (ReportOperationEventResponse);
  rpc AuthorizeOperationReporter(AuthorizeOperationReporterRequest) returns (AuthorizeOperationReporterResponse);
  rpc GetOperationReceipt(GetOperationReceiptRequest) returns (GetOperationReceiptResponse);
  rpc QueryOperationStatistics(QueryOperationStatisticsRequest) returns (QueryOperationStatisticsResponse);
  rpc ListKiokuCandidates(ListKiokuCandidatesRequest) returns (ListKiokuCandidatesResponse);
  rpc ReviewKiokuMemory(ReviewKiokuMemoryRequest) returns (ReviewKiokuMemoryResponse);
  rpc ReassessKiokuMemory(ReassessKiokuMemoryRequest) returns (ReassessKiokuMemoryResponse);
  rpc IssueGunshiRecommendations(IssueGunshiRecommendationsRequest) returns (IssueGunshiRecommendationsResponse);
  rpc RecordGunshiFeedback(RecordGunshiFeedbackRequest) returns (RecordGunshiFeedbackResponse);
  rpc GetGunshiScorecard(GetGunshiScorecardRequest) returns (GetGunshiScorecardResponse);
  rpc InstallGunshiAllocationBaseline(InstallGunshiAllocationBaselineRequest) returns (InstallGunshiAllocationBaselineResponse);
  rpc PromoteGunshiAllocationPolicy(PromoteGunshiAllocationPolicyRequest) returns (PromoteGunshiAllocationPolicyResponse);
  rpc RollbackGunshiAllocationPolicy(RollbackGunshiAllocationPolicyRequest) returns (RollbackGunshiAllocationPolicyResponse);
  rpc SetGunshiAutoOptIn(SetGunshiAutoOptInRequest) returns (SetGunshiAutoOptInResponse);
  rpc SetGunshiAllocationKillSwitch(SetGunshiAllocationKillSwitchRequest) returns (SetGunshiAllocationKillSwitchResponse);
  rpc GetGunshiAllocationStatus(GetGunshiAllocationStatusRequest) returns (GetGunshiAllocationStatusResponse);
  rpc AuthorizeGunshiAutoDispatch(AuthorizeGunshiAutoDispatchRequest) returns (AuthorizeGunshiAutoDispatchResponse);
  rpc PromoteGunshiFeedbackToEval(PromoteGunshiFeedbackToEvalRequest) returns (PromoteGunshiFeedbackToEvalResponse);
  rpc ReserveGatewayRequestAlias(ReserveGatewayRequestAliasRequest) returns (ReserveGatewayRequestAliasResponse);
  rpc ClaimGatewayRequestAliasDispatch(ClaimGatewayRequestAliasDispatchRequest) returns (ClaimGatewayRequestAliasDispatchResponse);

  // Affinity
  rpc GetAffinity(GetAffinityRequest) returns (GetAffinityResponse);

  // Eval
  rpc PutEvaluatorDefinition(PutEvaluatorDefinitionRequest) returns (PutEvaluatorDefinitionResponse);
  rpc GetEvaluatorDefinition(GetEvaluatorDefinitionRequest) returns (GetEvaluatorDefinitionResponse);
  rpc ListEvaluatorDefinitions(ListEvaluatorDefinitionsRequest) returns (ListEvaluatorDefinitionsResponse);
  rpc SetEvaluatorAvailability(SetEvaluatorAvailabilityRequest) returns (SetEvaluatorAvailabilityResponse);
  rpc PutEvaluationPlan(PutEvaluationPlanRequest) returns (PutEvaluationPlanResponse);
  rpc GetEvaluationPlan(GetEvaluationPlanRequest) returns (GetEvaluationPlanResponse);
  rpc ListEvaluationPlans(ListEvaluationPlansRequest) returns (ListEvaluationPlansResponse);
  rpc ResolveEvaluationPlan(ResolveEvaluationPlanRequest) returns (ResolveEvaluationPlanResponse);
  rpc CreateEvalSuite(CreateEvalSuiteRequest) returns (CreateEvalSuiteResponse);
  rpc ListEvalSuites(ListEvalSuitesRequest) returns (ListEvalSuitesResponse);
  rpc GetEvalSuite(GetEvalSuiteRequest) returns (GetEvalSuiteResponse);
  rpc CreateEvalRun(CreateEvalRunRequest) returns (CreateEvalRunResponse);
  rpc GetEvalRun(GetEvalRunRequest) returns (GetEvalRunResponse);
  rpc ListEvalRuns(ListEvalRunsRequest) returns (ListEvalRunsResponse);
  rpc TrackEvalIteration(TrackEvalIterationRequest) returns (TrackEvalIterationResponse);
  rpc GetLatestEvalIteration(GetLatestEvalIterationRequest) returns (GetLatestEvalIterationResponse);
  rpc ListEvalIterations(ListEvalIterationsRequest) returns (ListEvalIterationsResponse);
  rpc CompareRuns(CompareRunsRequest) returns (CompareRunsResponse);
  rpc GetEvidenceContextGate(GetEvidenceContextGateRequest) returns (GetEvidenceContextGateResponse);
  rpc EvalVariance(EvalVarianceRequest) returns (EvalVarianceResponse);
  rpc EvalModelCompare(EvalModelCompareRequest) returns (EvalModelCompareResponse);

  // Evolve
  rpc EvolveSuggest(EvolveSuggestRequest) returns (EvolveSuggestResponse);
  rpc EvolveEnhance(EvolveEnhanceRequest) returns (EvolveEnhanceResponse);
  rpc EvolveRecommend(EvolveRecommendRequest) returns (EvolveRecommendResponse);
  rpc EvolveReport(EvolveReportRequest) returns (EvolveReportResponse);
  rpc EvolvePatterns(EvolvePatternsRequest) returns (EvolvePatternsResponse);
  rpc EvolveVariance(EvolveVarianceRequest) returns (EvolveVarianceResponse);
  rpc EvolveAbResults(EvolveAbResultsRequest) returns (EvolveAbResultsResponse);
  rpc EvolveTemplates(EvolveTemplatesRequest) returns (EvolveTemplatesResponse);
}
