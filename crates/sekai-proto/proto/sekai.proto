message ClaimActionWorkRequest {
  string effect_id = 1;
  string runtime_id = 2;
  string request_id = 3;
  int64 ttl_ms = 4;
}
message ClaimActionWorkResponse {
  ActionEffect effect = 1;
  ActionWorkContinuation continuation = 2;
  ActionWorkPark park = 3;
  // Short-lived runtime token bound to the claiming principal, tenant,
  // namespace, effect, runtime and claim generation. It authenticates
  // HeartbeatActionClaim, AckActionWork and ReportActionClaimEvent for this
  // claim only. Empty when the plane has no signing key or the caller has no
  // tenant; callers then keep using their own credential.
  string runtime_token = 4;
  // Never later than effect.claim_expires_at_ms. Zero when runtime_token is empty.
  int64 runtime_token_expires_at_ms = 5;
}
message HeartbeatActionClaimRequest {
  string effect_id = 1;
  string runtime_id = 2;
  uint64 claim_generation = 3;
  string fencing_token = 4;
  int64 ttl_ms = 5;
}
message HeartbeatActionClaimResponse {
  ActionEffect effect = 1;
  // Refreshed runtime token for the extended claim; same rules as on claim.
  string runtime_token = 2;
  int64 runtime_token_expires_at_ms = 3;
}
message AckActionWorkRequest {
  string effect_id = 1;
  string runtime_id = 2;
  uint64 claim_generation = 3;
  string fencing_token = 4;
  // completed | failed | parked
  string outcome = 5;
  string reason = 6;
  // Required for parked acknowledgements; key+digest replay survives lease clear.
  string request_id = 7;
  string checkpoint_store_id = 8;
  string checkpoint_ref = 9;
  // sha256:<64 lowercase hex>
  string checkpoint_digest = 10;
  // Optional credential-free retained-artifact manifest JSON. Empty means
  // omitted. Completed acknowledgements may persist it on the operation
  // receipt as `artifact`. Failed and parked acknowledgements must omit it.
  // The plane rejects file bytes and other payload keys; hosts retain content.
  string artifact_json = 11;
}
message AckActionWorkResponse {
  ActionEffect effect = 1;
  ActionWorkPark park = 2;
  bool replay = 3;
}

// Scope registration of a worker acting as a service principal (#1508,
// ADR 0099). Holds no credential: tokens come from the identity extension.
message ServicePrincipal {
  string principal = 1;
  // Owning tenant. Must be the caller's authenticated tenant; empty only when
  // the caller has no tenant authority.
  string tenant_id = 2;
  // Namespaces the principal may address. Required, sorted and unique.
  repeated string namespaces = 3;
  // Action type ids the principal may run. Required, sorted and unique.
  repeated string action_types = 4;
  // Read-only: the principal profile's classification_ceiling, which is the
  // principal's marking ceiling. Empty when the profile sets none.
  string classification_ceiling = 5;
  string registered_by = 6;
  int64 created_at_ms = 7;
  int64 updated_at_ms = 8;
}
message PutServicePrincipalRequest { ServicePrincipal service_principal = 1; }
message PutServicePrincipalResponse { ServicePrincipal service_principal = 1; }
