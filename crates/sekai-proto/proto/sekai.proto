// A reference-only, version-pinned context transfer between principals. The
// manifest never embeds artifact, evidence, receipt, or memory content.
message HandoffReference {
  string kind = 1;       // operation_receipt | work_unit | object | evidence_submission | kioku
  string id = 2;
  string version = 3;    // content digest, object revision, work-unit revision, or Kioku version
  bool omitted = 4;
  string omission_reason = 5; // policy | retention | unavailable
}
message HandoffManifest {
  string id = 1;
  string namespace = 2;
  string parent_operation_id = 3;
  string parent_attempt_id = 4;
  string parent_work_unit_id = 5;
  repeated HandoffReference references = 6;
  string creator_principal = 7;
  string intended_principal = 8;
  string intended_scope = 9;
  string purpose = 10;
  int64 created_at_ms = 11;
  int64 expires_at_ms = 12;
  string digest = 13;
  string supersedes_manifest_id = 14;
  bool revoked = 15;
}
message CreateHandoffRequest { HandoffManifest manifest = 1; string request_id = 2; }
message CreateHandoffResponse { HandoffManifest manifest = 1; }
message ResolveHandoffRequest { string manifest_id = 1; }
message ResolveHandoffResponse {
  HandoffManifest manifest = 1;
  repeated HandoffReference available_references = 2;
  repeated HandoffReference omissions = 3;
}
message RevokeHandoffRequest { string manifest_id = 1; string reason = 2; string request_id = 3; }
message RevokeHandoffResponse { HandoffManifest manifest = 1; }

// A reusable, namespace-scoped lease. `generation` is a monotonically
// increasing fencing number and `fencing_token` uniquely identifies the
// acquisition. Downstream mutation executors must reject a generation older
// than the highest generation they have observed.
message Lease {
  string namespace = 1;
  string key = 2;
  uint64 generation = 3;
  string fencing_token = 4;
  string owner = 5;
  string status = 6; // active or released
  int64 acquired_at_ms = 7;
  int64 refreshed_at_ms = 8;
  int64 expires_at_ms = 9;
  int64 released_at_ms = 10;
  // Region/site pin stamped from SEKAI_SITE_ID (default "local"). #293
  string site_id = 11;
}
message AcquireLeaseRequest {
  string namespace = 1;
  string key = 2;
  string owner = 3;
  int64 ttl_ms = 4;
  string request_id = 5;
}
message AcquireLeaseResponse { Lease lease = 1; }
message GetLeaseRequest { string namespace = 1; string key = 2; }
message GetLeaseResponse { Lease lease = 1; }
message RefreshLeaseRequest {
  string namespace = 1;
  string key = 2;
  string fencing_token = 3;
  int64 ttl_ms = 4;
  string request_id = 5;
}
message RefreshLeaseResponse { Lease lease = 1; }
message ReleaseLeaseRequest {
  string namespace = 1;
  string key = 2;
  string fencing_token = 3;
  string request_id = 4;
}
message ReleaseLeaseResponse { Lease lease = 1; }
message TakeoverExpiredLeaseRequest {
  string namespace = 1;
  string key = 2;
  string owner = 3;
  string expected_fencing_token = 4;
  int64 expected_expires_at_ms = 5;
  int64 ttl_ms = 6;
  string request_id = 7;
}
message TakeoverExpiredLeaseResponse { Lease lease = 1; }

// Authorizes one idempotent graph mutation while the referenced lease
// generation remains active. The fencing token is opaque and is never copied
// into object audit history.
message LeasePrecondition {
  string namespace = 1;
  string key = 2;
  string fencing_token = 3;
  string request_id = 4;
}
message GuardedCreateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message GuardedCreateObjectResponse { Object object = 1; }
message GuardedUpdateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message GuardedUpdateObjectResponse { Object object = 1; }
message GuardedDeleteObjectRequest {
  string id = 1;
  LeasePrecondition lease_precondition = 2;
}
message GuardedDeleteObjectResponse {}

// --- Service ---

// Durable, namespace-isolated facts for agent operations. Domain-specific
// concepts are represented through typed objects and links rather than new
// fields in this core contract.
service SekaiService {
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);
  rpc RefreshLease(RefreshLeaseRequest) returns (RefreshLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc TakeoverExpiredLease(TakeoverExpiredLeaseRequest) returns (TakeoverExpiredLeaseResponse);
  rpc GuardedCreateObject(GuardedCreateObjectRequest) returns (GuardedCreateObjectResponse);
  rpc GuardedUpdateObject(GuardedUpdateObjectRequest) returns (GuardedUpdateObjectResponse);
  rpc GuardedDeleteObject(GuardedDeleteObjectRequest) returns (GuardedDeleteObjectResponse);
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc UpdateObject(UpdateObjectRequest) returns (UpdateObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc CreateObjectSet(CreateObjectSetRequest) returns (CreateObjectSetResponse);
  rpc ListObjectSets(ListObjectSetsRequest) returns (ListObjectSetsResponse);
  rpc DeleteObjectSet(DeleteObjectSetRequest) returns (DeleteObjectSetResponse);
  rpc ResolveObjectSet(ResolveObjectSetRequest) returns (ListObjectsResponse);
  rpc FindByExternalId(FindByExternalIdRequest) returns (GetObjectResponse);
  rpc FindByProperty(FindByPropertyRequest) returns (ListObjectsResponse);

  rpc CreateLink(CreateLinkRequest) returns (CreateLinkResponse);
  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse);
  rpc GetLinks(GetLinksRequest) returns (GetLinksResponse);
  rpc GetLinkedObjects(GetLinkedObjectsRequest) returns (GetLinkedObjectsResponse);

  rpc Traverse(TraverseRequest) returns (TraverseResponse);
  rpc RetrieveContext(RetrieveContextRequest) returns (RetrieveContextResponse);
  // Lexical FTS5 text representation + HybridCandidate envelope (#360).
  rpc SearchText(SearchTextRequest) returns (SearchTextResponse);
  // Late-fusion hybrid plan over explicit representations (#361).
  rpc HybridRetrieve(HybridRetrieveRequest) returns (HybridRetrieveResponse);
  // Multi-hop pattern plan IR execute + EXPLAIN (#375 / research #145).
  rpc ExecutePatternPlan(ExecutePatternPlanRequest) returns (ExecutePatternPlanResponse);
  rpc ExplainPatternPlan(ExplainPatternPlanRequest) returns (ExplainPatternPlanResponse);
  // Request-scoped non-authoritative scenario overlay (#362).
  rpc EvaluateScenario(EvaluateScenarioRequest) returns (EvaluateScenarioResponse);
  rpc ResolveSemanticRef(ResolveSemanticRefRequest) returns (ResolveSemanticRefResponse);
  rpc ExpandRelations(ExpandRelationsRequest) returns (ExpandRelationsResponse);
  rpc ExplainDerivation(ExplainDerivationRequest) returns (ExplainDerivationResponse);
  rpc DiscoverCapabilities(DiscoverCapabilitiesRequest) returns (DiscoverCapabilitiesResponse);
  rpc InstallCapabilityPackage(InstallCapabilityPackageRequest) returns (InstallCapabilityPackageResponse);
  rpc GetCapabilityPackage(GetCapabilityPackageRequest) returns (GetCapabilityPackageResponse);
  // Product transition path: evaluate/upgrade/rollback/disable/uninstall (#389).
  rpc TransitionCapabilityPackage(TransitionCapabilityPackageRequest) returns (TransitionCapabilityPackageResponse);
  // Experimental shims over TransitionCapabilityPackage (deprecated aliases).
  rpc EvaluateCapabilityPackage(CapabilityPackageTransitionRequest) returns (EvaluateCapabilityPackageResponse);
  rpc UpgradeCapabilityPackage(UpgradeCapabilityPackageRequest) returns (UpgradeCapabilityPackageResponse);
  rpc RollbackCapabilityPackage(CapabilityPackageTransitionRequest) returns (CapabilityPackageTransitionResponse);
  rpc DisableCapabilityPackage(CapabilityPackageTransitionRequest) returns (CapabilityPackageTransitionResponse);
  rpc UninstallCapabilityPackage(CapabilityPackageTransitionRequest) returns (UninstallCapabilityPackageResponse);
  rpc SetCapabilityPackageTrustPolicy(SetCapabilityPackageTrustPolicyRequest) returns (SetCapabilityPackageTrustPolicyResponse);
  rpc GetCapabilityPackageTrustPolicy(GetCapabilityPackageTrustPolicyRequest) returns (GetCapabilityPackageTrustPolicyResponse);
  rpc PutCapabilityPackageSigner(PutCapabilityPackageSignerRequest) returns (PutCapabilityPackageSignerResponse);
  rpc ListCapabilityPackageSigners(ListCapabilityPackageSignersRequest) returns (ListCapabilityPackageSignersResponse);
  rpc ApplyGovernedFactProfile(ApplyGovernedFactProfileRequest) returns (ApplyGovernedFactProfileResponse);
  rpc PutGovernedFactVersion(PutGovernedFactVersionRequest) returns (PutGovernedFactVersionResponse);
  rpc GetGovernedFactVersion(GetGovernedFactVersionRequest) returns (GetGovernedFactVersionResponse);
  rpc PutGovernedWaiverVersion(PutGovernedWaiverVersionRequest) returns (PutGovernedWaiverVersionResponse);
  rpc GetGovernedWaiverVersion(GetGovernedWaiverVersionRequest) returns (GetGovernedWaiverVersionResponse);
  rpc ResolveInvariantSet(ResolveInvariantSetRequest) returns (ResolveInvariantSetResponse);

  rpc ListSchemaTypes(ListSchemaTypesRequest) returns (ListSchemaTypesResponse);
  rpc CreateSchemaType(CreateSchemaTypeRequest) returns (CreateSchemaTypeResponse);
  rpc DeleteSchemaType(DeleteSchemaTypeRequest) returns (DeleteSchemaTypeResponse);
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  rpc CreateInterface(CreateInterfaceRequest) returns (CreateInterfaceResponse);
  rpc DeleteInterface(DeleteInterfaceRequest) returns (DeleteInterfaceResponse);
  rpc ListOntologyClasses(ListOntologyClassesRequest) returns (ListOntologyClassesResponse);
  rpc GetOntologyClass(GetOntologyClassRequest) returns (GetOntologyClassResponse);
  rpc CreateOntologyClass(CreateOntologyClassRequest) returns (CreateOntologyClassResponse);
  rpc DeleteOntologyClass(DeleteOntologyClassRequest) returns (DeleteOntologyClassResponse);
