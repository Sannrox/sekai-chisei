// Durable, namespace-isolated facts for agent operations. Domain-specific
// concepts are represented through typed objects and links rather than new
// fields in this core contract.
service SekaiService {
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse);
  rpc RefreshLease(RefreshLeaseRequest) returns (RefreshLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc TakeoverExpiredLease(TakeoverExpiredLeaseRequest) returns (TakeoverExpiredLeaseResponse);
  rpc ApplySourceBatch(ApplySourceBatchRequest) returns (ApplySourceBatchResponse);
  rpc GetSourceSyncState(GetSourceSyncStateRequest) returns (GetSourceSyncStateResponse);
  rpc ListSourceBatchTransactions(ListSourceBatchTransactionsRequest) returns (ListSourceBatchTransactionsResponse);
  rpc RegisterSourceTypeDescriptor(RegisterSourceTypeDescriptorRequest) returns (RegisterSourceTypeDescriptorResponse);
  rpc InspectSourceTypeDescriptor(InspectSourceTypeDescriptorRequest) returns (InspectSourceTypeDescriptorResponse);
  rpc RetireSourceTypeDescriptor(RetireSourceTypeDescriptorRequest) returns (RetireSourceTypeDescriptorResponse);
  rpc CreateDefinitionBranch(CreateDefinitionBranchRequest) returns (CreateDefinitionBranchResponse);
  rpc GetDefinitionMember(GetDefinitionMemberRequest) returns (GetDefinitionMemberResponse);
  rpc GetDefinitionBranch(GetDefinitionBranchRequest) returns (GetDefinitionBranchResponse);
  rpc ApplyDefinitionBranchEdit(ApplyDefinitionBranchEditRequest) returns (ApplyDefinitionBranchEditResponse);
  rpc CreateDefinitionProposal(CreateDefinitionProposalRequest) returns (CreateDefinitionProposalResponse);
  rpc GetDefinitionProposal(GetDefinitionProposalRequest) returns (GetDefinitionProposalResponse);
