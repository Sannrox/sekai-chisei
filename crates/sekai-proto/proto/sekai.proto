// Members are read with the caller's authority; signals come from what the
// caller can see.
message ScoreObjectTrustRequest {
  ObjectSetDescriptor descriptor = 1;
  string page_token = 2;
  // Omit members scoring below this (0..=100).
  uint32 min_score = 3;
