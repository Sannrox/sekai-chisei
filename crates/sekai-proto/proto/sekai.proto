  string definition_digest = 7;
  bool candidate = 8;
  string engine_version = 9;
  int64 as_of_ms = 10;
  string baseline_version_id = 11;
  repeated string non_deterministic = 12;
  string markings_out = 13;
  string output_digest = 14;
  ReplayDiff diff = 15;
  repeated ReplayDownstream downstream = 16;
  string actor = 17;
  int64 created_at_ms = 18;
}
