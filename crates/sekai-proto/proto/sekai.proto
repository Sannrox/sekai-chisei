syntax = "proto3";
package sekai;

// --- Messages ---

message Object {
  string id = 1;
  string kind = 2;
  string name = 3;
  string namespace = 4;
  string external_id = 5;
  map<string, string> properties = 6;
  int64 created = 7;
  int64 updated = 8;
}

message Link {
  string id = 1;
  string from_id = 2;
  string to_id = 3;
  string relation = 4;
  int64 created = 5;
}

message ListFilter {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  repeated PropertyFilter property_filters = 4;
  int32 limit = 5;
  int32 offset = 6;
  string order_by = 7;
  bool descending = 8;
  repeated string interface_filter = 9;
}

message PropertyFilter {
  string key = 1;
  string op = 2;
  string value = 3;
}

message GraphQuery {
  string start_id = 1;
  string start_external_id = 2;
  repeated string relations = 3;
  string direction = 4;
  int32 max_depth = 5;
  repeated string kind_filter = 6;
  map<string, string> property_filter = 7;
  repeated string interface_filter = 8;
}

message GraphResult {
  repeated Object objects = 1;
  repeated Link links = 2;
}

// Experimental (#1562). Bounded expansion from seed objects over links in both
// directions. Every hop applies the caller's read policy; hidden objects and
// links to them are omitted, so counts describe the visible graph only.
message ExpandNeighborhoodRequest {
  repeated string seed_ids = 1;
  // Link relations to follow; empty follows every relation.
  repeated string relations = 2;
  // Object kinds to include and expand beyond the seeds; empty includes all.
  repeated string object_kinds = 3;
  // Hops from the seeds, 1 to 4; 0 means 1.
  int32 depth = 4;
  // Neighbors of one node that are returned and expanded further; 0 means 100.
  int32 fan_out_cap = 5;
  // Objects returned, seeds first then breadth-first; 0 means 100.
  int32 limit = 6;
}
message ExpandNeighborhoodResponse {
  repeated Object objects = 1;
  // Links whose two ends are both in `objects`.
  repeated Link links = 2;
  // Visible objects within `depth`, including seeds and those past a cap.
  int64 total_count = 3;
  // True when a fan-out cap or the examination budget left nodes unexpanded.
  bool total_is_lower_bound = 4;
  // True when `objects` holds fewer than `total_count` objects.
  bool truncated = 5;
}

// Experimental (#1562). Shortest link paths between two objects over the
// caller's visible graph, following links in both directions.
message FindPathsRequest {
  string from_id = 1;
  string to_id = 2;
  // 1 to 4; 0 means 4.
  int32 max_depth = 3;
  repeated string relations = 4;
  // Paths returned; 0 means 10.
  int32 limit = 5;
}
message ObjectPath {
  // From `from_id` to `to_id`.
  repeated string object_ids = 1;
  // `links[i]` joins `object_ids[i]` and `object_ids[i + 1]`, in either direction.
  repeated Link links = 2;
}
message FindPathsResponse {
  // All shortest paths, up to `limit`, in a stable order.
  repeated ObjectPath paths = 1;
  // Every object on a returned path, once.
  repeated Object objects = 2;
  // True when more shortest paths exist than `limit` or the examination budget ran out.
  bool truncated = 3;
}

message ObjectType {
  string kind = 1;
  string description = 2;
  repeated PropertyDef properties = 3;
  bool is_builtin = 4;
  repeated string implements = 5;
}

message PropertyDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
  string link_kind = 6;
  string compute_expr = 7;
  string classification = 8;
  repeated StructFieldDef struct_fields = 9;
}

message StructFieldDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
}

// Ontology layer (issue #141): first-class semantic concepts above the graph.
message OntologyProperty {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
}

message Cardinality {
  uint32 min = 1;
  optional uint32 max = 2;
}

message OntologyClass {
  string name = 1;
  string description = 2;
  repeated string superclasses = 3;
  repeated string equivalent_classes = 4;
  repeated string disjoint_classes = 5;
  repeated OntologyProperty properties = 6;
  bool is_builtin = 7;
  string mapped_kind = 8;
}

message OntologyRelation {
  string name = 1;
  string description = 2;
  string domain = 3;
  string range = 4;
  Cardinality cardinality = 5;
  string inverse = 6;
  bool transitive = 7;
  bool is_builtin = 8;
  string mapped_relation = 9;
}

message Function {
  string name = 1;
  string description = 2;
  repeated FuncParam params = 3;
  repeated PipelineStep pipeline = 4;
  int64 created = 5;
}

message FuncParam {
  string name = 1;
  string type = 2;
  bool required = 3;
}

message OperatorStep {
  string op = 1;
  string kind = 2;
  string property = 3;
  string value = 4;
  string relation = 5;
  string dir = 6;
  string func = 7;
  string field = 8;
  string as = 9;
}

message LlmStep {
  string prompt_revision = 1;
  map<string, string> input_bindings = 2;
  string output_schema = 3;
  string model_route = 4;
  uint32 minimum_confidence_micros = 5;
}

message PipelineStep {
  // Legacy operator fields remain wire-compatible with clients before #1368.
  string op = 1;
  string kind = 2;
  string property = 3;
  string value = 4;
  string relation = 5;
  string dir = 6;
  string func = 7;
  string field = 8;
  string as = 9;

  oneof step {
    OperatorStep operator = 10;
    LlmStep llm = 11;
  }
}

message Dataset {
  string id = 1;
  string name = 2;
  repeated ColumnDef columns = 3;
  string object_id = 4;
  int64 created = 5;
  // Ordered partition column names. Empty keeps a whole-dataset digest.
  repeated string partition_keys = 6;
}

message ColumnDef {
  string name = 1;
  string type = 2;
  string classification = 3;
}

message RowFilter {
  string column = 1;
  string op = 2;
  string value = 3;
}

message RowQuery {
  repeated RowFilter filters = 1;
  repeated string columns = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message VirtualTable {
  string id = 1;
  string name = 2;
  string dataset_id = 3;
  repeated RowFilter filters = 4;
  repeated string columns = 5;
  int64 created = 6;
}

message Grant {
  string id = 1;
  string object_id = 2;
  string principal = 3;
  string role = 4;
  int64 created = 5;
  string purpose = 6;
  int64 not_after_ms = 7;
  string exception_reason = 8;
}

// Control-plane write freeze (#1458). scope_kind is namespace, tenant, principal, or action.
message WriteFreeze {
  string scope_kind = 1;
  string scope_value = 2;
  string mode = 3;
  string reason = 4;
  bool enabled = 5;
  int64 updated_ms = 6;
}

message Decision {
  string id = 1;
  int64 timestamp = 2;
  string actor = 3;
  string action = 4;
  string reason = 5;
  map<string, string> evidence = 6;
  string target_id = 7;
  string outcome = 8;
}

message ObjectChange {
  string id = 1;
  string object_id = 2;
  string field = 3;
  string old_value = 4;
  string new_value = 5;
  string changed_by = 6;
  int64 timestamp = 7;
  // Plane-stamped operation identity when the change was produced by a
  // governed action. Empty for mutations that have no bound operation.
  string operation_id = 8;
  // Who wrote the change (#1690): source_transaction, transform_run,
  // action_instance, direct, or unattributed when the row records none.
  string writer_kind = 9;
  // The source transaction, `run@checkpoint`, or Action instance.
  string writer_ref = 10;
  // The writer's durable receipt: source transaction, transform run, or the
  // Action's operation receipt.
  string receipt_id = 11;
}

// A versioned description of an existing native query or retrieval surface.
// Object schemas reuse the canonical definitions above; the catalog does not
// introduce a second schema language.
message CapabilityEntry {
  string name = 1;
  string description = 2;
  string kind = 3; // query | retrieval | action
  string lifecycle_state = 4; // preview | active | deprecated | disabled | revoked
  string contract_version = 5;
  string minimum_compatible_version = 6;
  string maximum_compatible_version = 7;
  string replacement_capability = 8;
  string input_type = 9;  // canonical protobuf message name
  string output_type = 10; // canonical protobuf message name
  repeated string required_scopes = 11;
  repeated string policy_decision_points = 12;
  string risk_class = 13;
  string approval_behavior = 14; // none | may_require | required
  repeated CapabilityLimit limits = 15;
  ObjectType object_type = 16;
  reserved 17; // removed pre-1.0 legacy graph ActionTypeDef projection
  repeated string evidence_requirements = 18;
  // Product tier for discovery filters (#386 / research #383): core | advanced | experimental.
  // Empty means untagged (treated as advanced for filtering).
  string product_tier = 19;
  // Closed parameter JSON Schema copied from the governed Action type. Empty
  // for query and retrieval entries. Not a second schema language.
  string parameter_schema_json = 20;
  // Visible classification markings remaining after restricted-property
  // redaction. Hidden markings are omitted.
  repeated string markings = 21;
  // Governed Action type version selected for this catalog entry. Empty on
  // query and retrieval entries. When several versions of one type_id are
  // enabled, the catalog keeps the last row in type_id/version order.
  string action_version = 22;
  // Derived effect of an Action entry as an agent tool: read, mutating or
  // destructive (#1646). Empty on query and retrieval entries.
  string tool_effect = 23;
}

message CapabilityLimit {
  string name = 1;
  uint64 value = 2;
}

message DiscoverCapabilitiesRequest {
  string namespace = 1;
  string contract_version = 2; // empty negotiates the latest supported version
  string catalog_version = 3; // pins pagination to an observed snapshot
  uint32 page_size = 4; // defaults to 50 and is capped at 200
  string page_token = 5;
  // Product-tier filter: empty = core. Use "all" to opt into the complete
  // catalog. Values: all | core | advanced | experimental.
  string product_tier_filter = 6;
}

message DiscoverCapabilitiesResponse {
  repeated CapabilityEntry capabilities = 1;
  string contract_version = 2;
  string catalog_version = 3;
  string next_page_token = 4;
  uint32 total_size = 5;
  string cache_scope = 6; // always authorization_context
  // Published definition revision digest the caller may read. Empty when the
  // namespace has no published revision or the caller cannot see it.
  // catalog_version still changes when this value changes.
  string ontology_revision = 7;
}

// Fixed graph-backed profile for immutable requirement, invariant, and waiver
// facts. The contract is domain-neutral: subject profiles and references remain
// opaque integration-owned identifiers, while evaluation semantics are bound
// later by Chisei evaluation plans.
message GovernedFactApplicability {
  repeated string subject_profiles = 1;
  repeated string subject_refs = 2;
}

message InvariantVerificationContract {
  string predicate_kind = 1;
  string input_schema = 2;
  string result_schema = 3;
  repeated string evidence_types = 4;
}

message GovernedFactVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string fact_id = 4;
  string version = 5;
  string fact_type = 6; // requirement | invariant
  string statement = 7;
  GovernedFactApplicability applicability = 8;
  InvariantVerificationContract verification = 9;
  repeated string requirement_version_ids = 10;
  // Exact IDs of authorized projected external_evidence graph objects.
  repeated string evidence_refs = 11;
  string source_ref = 12;
  int64 effective_from_ms = 13;
  string supersedes_object_id = 14;
  string content_digest = 15;
  string created_by = 16;
  int64 created_at_ms = 17;
  string access_marking = 18;
  string status = 19; // active | retired
}

message GovernedWaiverVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string waiver_id = 4;
  string version = 5;
  repeated string invariant_version_ids = 6;
  GovernedFactApplicability applicability = 7;
  string reason = 8;
  repeated string evidence_refs = 9;
  string source_ref = 10;
  int64 valid_from_ms = 11;
  int64 expires_at_ms = 12;
  string supersedes_object_id = 13;
  string content_digest = 14;
  string created_by = 15;
  int64 created_at_ms = 16;
  string access_marking = 17;
}

message GetGovernedFactVersionRequest { string object_id = 1; }
message GetGovernedFactVersionResponse {
  GovernedFactVersion fact = 1;
}

message ResolveInvariantSetRequest {
  string namespace = 1;
  string subject_profile = 2;
  string subject_ref = 3;
  int64 evaluation_time_ms = 4;
  uint32 max_items = 5;
}
message ResolvedInvariantSet {
  string contract_version = 1;
  string set_id = 2;
  string set_digest = 3;
  string profile_digest = 4;
  string namespace = 5;
  string subject_profile = 6;
  string subject_ref = 7;
  int64 evaluation_time_ms = 8;
  repeated GovernedFactVersion requirements = 9;
  repeated GovernedFactVersion invariants = 10;
  repeated GovernedWaiverVersion waivers = 11;
}
message ResolveInvariantSetResponse {
  ResolvedInvariantSet invariant_set = 1;
}

message LineageNode {
  Object object = 1;
  string role = 2;
  bool ephemeral = 3;
}

message LineageEdge {
  string from = 1;
  string to = 2;
  string relation = 3;
}

message LineageResult {
  repeated LineageNode nodes = 1;
  repeated LineageEdge edges = 2;
  bool truncated = 3;
}

// --- Request/Response wrappers ---

// Optional lease_precondition unifies ordinary and generation-fenced writes.
message CreateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message CreateObjectResponse { Object object = 1; }
message GetObjectRequest { string id = 1; }
message GetObjectResponse { Object object = 1; }
message UpdateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message UpdateObjectResponse { Object object = 1; }
message DeleteObjectRequest {
  string id = 1;
  LeasePrecondition lease_precondition = 2;
}
message DeleteObjectResponse {}
message ListObjectsRequest { ListFilter filter = 1; string page_token = 2; }
message ListObjectsResponse { repeated Object objects = 1; int32 total = 2; string next_page_token = 3; }
message ObjectSetTraversal {
  string relation = 1;
  string direction = 2;
  string far_kind = 3;
  string join_property = 4;
}
message ObjectSetAggregation {
  string function = 1;
  string property = 2;
  string group_by = 3;
}
message ObjectSetCostLimit {
  int32 max_rows_scanned = 1;
  int32 max_depth = 2;
  int64 max_time_ms = 3;
}
message ObjectSetAggregateRow {
  string group_key = 1;
  double value = 2;
  int64 count = 3;
}
message ObjectSetDescriptor {
  string contract_version = 1;
  string namespace = 2;
  string kind = 3;
  string definition_digest = 4;
  repeated PropertyFilter property_filters = 5;
  string order_by = 6;
  bool descending = 7;
  int32 limit = 8;
  ObjectSetTraversal traversal = 9;
  repeated ObjectSetTraversal hops = 10;
  ObjectSetAggregation aggregation = 11;
  ObjectSetCostLimit cost_limit = 12;
}
message EvaluateObjectSetRequest {
  ObjectSetDescriptor descriptor = 1;
  string page_token = 2;
  int64 required_freshness_ms = 3;
}
message ObjectTypeDatasource {
  string contract_version = 1;
  string namespace = 2;
  string kind = 3;
  string definition_digest = 4;
  string dataset_id = 5;
  string key_column = 6;
  map<string, string> property_mapping = 7;
  string hidden_column = 8;
  bool edits_only = 9;
}
message RegisterObjectTypeDatasourceRequest {
  ObjectTypeDatasource datasource = 1;
  string idempotency_key = 2;
}
message RegisterObjectTypeDatasourceResponse {
  ObjectTypeDatasource datasource = 1;
}
message ReindexObjectTypeRequest {
  string namespace = 1;
  string kind = 2;
  bool full_rebuild = 3;
}
message ReindexObjectTypeResponse {
  int32 rewritten_keys = 1;
  int32 skipped_unchanged = 2;
  bool quarantined = 3;
  string quarantine_reason = 4;
  ObjectTypeIndexStatus status = 5;
}
message GetObjectTypeIndexStatusRequest {
  string namespace = 1;
  string kind = 2;
}
message ObjectTypeIndexStatus {
  string namespace = 1;
  string kind = 2;
  int64 indexed_at_ms = 3;
  int32 member_count = 4;
  bool stale = 5;
  string quarantine_reason = 6;
  int64 lag_ms = 7;
}
message GetObjectTypeIndexStatusResponse {
  ObjectTypeIndexStatus status = 1;
}
message SearchPropertyFilter {
  string property = 1;
  string value = 2;
}
message SearchRequest {
  string namespace = 1;
  string text = 2;
  repeated string kinds = 3;
  repeated SearchPropertyFilter property_filters = 4;
  repeated string facets = 5;
  string page_token = 6;
  int32 page_size = 7;
  string source = 8;
  // "" or "text": text candidates only. "hybrid": text and exact vector
  // candidates, fused by late_fusion.rrf/v1 (reciprocal rank fusion, k=60).
  string mode = 9;
  // Hybrid weights per candidate list; both 0 means 1 each.
  double text_weight = 10;
  double vector_weight = 11;
}
message SearchHighlight {
  string field = 1;
  string text = 2;
}
message SearchHit {
  string source = 1;
  string id = 2;
  string kind = 3;
  repeated SearchHighlight highlights = 4;
  bool authority = 5;
}
message SearchFacetValue {
  string value = 1;
  int64 count = 2;
}
message SearchFacet {
  string field = 1;
  repeated SearchFacetValue values = 2;
}
message SearchResponse {
  repeated SearchHit hits = 1;
  int64 count = 2;
  bool count_is_lower_bound = 3;
  repeated SearchFacet facets = 4;
  string next_page_token = 5;
  bool authority = 6;
  int64 lag_ms = 7;
  // Set in hybrid mode.
  string fusion_profile = 8;
  // Age of the oldest object change the searched vectors have not consumed.
  int64 vector_lag_ms = 9;
}
message GetSearchIndexStatusRequest {
  string namespace = 1;
}
message GetSearchIndexStatusResponse {
  string namespace = 1;
  string analyzer_version = 2;
  int64 lag_ms = 3;
  int64 object_count = 4;
  int64 dataset_count = 5;
  bool authority = 6;
}
message PutObjectTypeIndexEditRequest {
  string namespace = 1;
  string kind = 2;
  string source_key = 3;
  map<string, string> properties = 4;
  bool hidden = 5;
  string idempotency_key = 6;
}
message PutObjectTypeIndexEditResponse {}
message TransformStep {
  string kind = 1;
  string column = 2;
  string op = 3;
  string value = 4;
  repeated string columns = 5;
}
message TransformInput {
  string alias = 1;
  string dataset_id = 2;
}
message GovernedTransform {
  string contract_version = 1;
  string namespace = 2;
  string transform_id = 3;
  string input_dataset_id = 4;
  string output_dataset_id = 5;
  repeated TransformStep steps = 6;
  string quality_rule = 7;
  string definition_digest = 8;
  string profile = 9;
  repeated TransformInput inputs = 10;
  string sql = 11;
  uint64 memory_limit_bytes = 12;
  uint64 time_limit_ms = 13;
  string engine = 14;
  string runtime_image = 15;
  int64 schedule_every_ms = 16;
  bool trigger_on_input_commit = 17;
  int64 trigger_debounce_ms = 18;
}
message PutGovernedTransformRequest {
  GovernedTransform transform = 1;
}
message PutGovernedTransformResponse {
  GovernedTransform transform = 1;
}
message PreviewGovernedTransformRequest {
  GovernedTransform transform = 1;
  uint32 row_cap = 2;
  string preview_id = 3;
}
message PreviewGovernedTransformInputStat {
  string alias = 1;
  string dataset_id = 2;
  int32 rows_read = 3;
}
message PreviewGovernedTransformRow {
  map<string, string> values = 1;
}
message PreviewGovernedTransformResponse {
  string preview_id = 1;
  string output_schema_json = 2;
  repeated PreviewGovernedTransformRow rows = 3;
  repeated PreviewGovernedTransformInputStat inputs = 4;
  string error = 5;
}
message RunGovernedTransformRequest {
  string namespace = 1;
  string transform_id = 2;
  bool incremental = 3;
}
message TransformRun {
  string run_id = 1;
  string namespace = 2;
  string transform_id = 3;
  string definition_digest = 4;
  string input_digest = 5;
  string output_digest = 6;
  int64 last_input_row_id = 7;
  bool incremental = 8;
  bool quarantined = 9;
  string quality_rule = 10;
  int32 rows_in = 11;
  int32 rows_out = 12;
  string lineage_parent = 13;
  int64 created_at_ms = 14;
  string markings_in = 15;
  string markings_out = 16;
  string profile = 17;
  string engine = 18;
  string runtime_image = 19;
  string dispatch_status = 20;
  string trigger_cause = 21;
  string trigger_ref = 22;
  repeated TransformPartition input_partitions = 23;
  repeated TransformPartition output_partitions = 24;
}
message TickGovernedTransformsRequest {
  int64 now_ms = 1;
}
message TickGovernedTransformsResponse {
  repeated TransformRun runs = 1;
}
message TransformOutputState {
  string namespace = 1;
  string dataset_id = 2;
  string freshness = 3;
  string upstream_version = 4;
  string blocked_run_id = 5;
  int64 updated_at_ms = 6;
}
message GetTransformOutputStateRequest {
  string namespace = 1;
  string dataset_id = 2;
}
message GetTransformOutputStateResponse {
  TransformOutputState state = 1;
}
message CancelGovernedTransformRunRequest {
  string run_id = 1;
}
message CancelGovernedTransformRunResponse {
  TransformRun run = 1;
}
message RunGovernedTransformResponse {
  TransformRun run = 1;
}
message GetGovernedTransformRunRequest {
  string run_id = 1;
}
message GetGovernedTransformRunResponse {
  TransformRun run = 1;
}
message ListGovernedTransformsRequest {
  string namespace = 1;
}
message ListGovernedTransformsResponse {
  repeated GovernedTransform transforms = 1;
}
message ListGovernedTransformRunsRequest {
  string namespace = 1;
  int32 limit = 2;
}
message ListGovernedTransformRunsResponse {
  repeated TransformRun runs = 1;
}
message TransformWork {
  string run_id = 1;
  string namespace = 2;
  string transform_id = 3;
  string definition_digest = 4;
  string engine = 5;
  string runtime_image = 6;
  string status = 7;
  string claim_owner = 8;
  int64 claim_generation = 9;
  string fencing_token = 10;
  int64 claim_expires_at_ms = 11;
  int64 lease_expiries = 12;
  int64 created_at_ms = 13;
  string tenant_id = 14;
}
message ListClaimableTransformWorkRequest {
  string namespace = 1;
  string runtime_id = 2;
  int32 limit = 3;
}
message ListClaimableTransformWorkResponse {
  repeated TransformWork work = 1;
}
message ClaimTransformWorkRequest {
  string namespace = 1;
  string runtime_id = 2;
  string run_id = 3;
  int64 ttl_ms = 4;
}
message ClaimTransformWorkResponse {
  TransformWork work = 1;
  GovernedTransform transform = 2;
}
message HeartbeatTransformClaimRequest {
  string run_id = 1;
  string runtime_id = 2;
  int64 claim_generation = 3;
  string fencing_token = 4;
  int64 ttl_ms = 5;
}
message HeartbeatTransformClaimResponse {
  TransformWork work = 1;
}
message TransformRunInputRow {
  string alias = 1;
  string dataset_id = 2;
  int64 row_id = 3;
  map<string, string> values = 4;
  string partition_key = 5;
}
message TransformPartition {
  string partition_key = 1;
  string digest = 2;
  int32 rows = 3;
}
message TransformPartitionWrite {
  string partition_key = 1;
  repeated TransformRunInputRow rows = 2;
}
message ReadTransformRunInputsRequest {
  string run_id = 1;
  string runtime_id = 2;
  int64 claim_generation = 3;
  string fencing_token = 4;
  string alias = 5;
  int64 after_row_id = 6;
  int32 limit = 7;
  // Empty alias reads every input in (alias, row_id) order; pass the last
  // row's alias here to continue that overview. Named alias ignores this.
  string after_alias = 8;
  // Unset reads every partition. Empty string selects the empty identity
  // (a missing single-column partition value) and must not mean "all".
  optional string partition_key = 9;
  int64 max_bytes = 10;
}
message ReadTransformRunInputsResponse {
  TransformRunInputRow row = 1;
}
message WriteTransformRunResultRequest {
  string run_id = 1;
  string runtime_id = 2;
  int64 claim_generation = 3;
  string fencing_token = 4;
  repeated TransformRunInputRow rows = 5;
  string output_digest = 6;
  bool quarantined = 7;
  string quality_rule = 8;
  repeated TransformPartitionWrite partitions = 9;
}
message WriteTransformRunResultResponse {
  TransformRun run = 1;
}
