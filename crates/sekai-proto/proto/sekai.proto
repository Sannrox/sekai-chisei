  string namespace = 1;
  string from_revision_digest = 2;
  string to_revision_digest = 3;
}
message ReportDefinitionConsumerImpactResponse {
  string completeness = 1;
  string from_revision_digest = 2;
  string to_revision_digest = 3;
  repeated DefinitionConsumerImpactPath impacts = 4;
}

// Author-declared intent a definition diff cannot show (ADR 0125).
message DefinitionPropertyRename {
  string object_type = 1;
  string from_property = 2;
  string to_property = 3;
}
message DefinitionPropertyDefault {
  string object_type = 1;
  string property = 2;
  // Value existing objects get for a new required property.
  string value = 3;
}
message DefinitionPropertyRef {
  string object_type = 1;
  string property = 2;
}
message DefinitionChangeHints {
  repeated DefinitionPropertyRename renames = 1;
  repeated DefinitionPropertyDefault defaults = 2;
  repeated DefinitionPropertyRef type_changes = 3;
}
// kind: rename_property, default_required_property, drop_property,
// type_change, or remove_object_type. Manual steps carry a reason code.
message DefinitionMigrationStep {
  string kind = 1;
  string object_type = 2;
  string property = 3;
  string from_property = 4;
  string default_value = 5;
  bool manual = 6;
  string reason = 7;
}
// mode: copy from the source property, or default to the source literal.
message DefinitionBackfillAssignment {
  string object_type = 1;
  string property = 2;
  string mode = 3;
  string source = 4;
}
message GenerateDefinitionChangeBundleRequest {
  string namespace = 1;
  string from_revision_digest = 2;
  string to_revision_digest = 3;
  DefinitionChangeHints hints = 4;
}
// Read-only: generation publishes, writes, and runs nothing.
message GenerateDefinitionChangeBundleResponse {
  string contract_version = 1;
  string bundle_digest = 2;
  DefinitionRevisionDiff diff = 3;
  repeated DefinitionMigrationStep steps = 4;
  string backfill_contract = 5;
  repeated DefinitionBackfillAssignment backfill = 6;
  // Caller-scoped; outside bundle_digest.
  ReportDefinitionConsumerImpactResponse impact = 7;
}

// Run a change bundle's backfill on a dataset branch per backed object type
// (#1692). Writes only branches named for the bundle digest, never the
// datasets themselves; a rerun converges on the same branch rows.
message DryRunDefinitionChangeBundleRequest {
  string namespace = 1;
  string from_revision_digest = 2;
  string to_revision_digest = 3;
  DefinitionChangeHints hints = 4;
  // When set, the regenerated bundle must still have this digest.
  string bundle_digest = 5;
}
message DefinitionBackfillSample {
  string key = 1;
  map<string, string> before = 2;
  map<string, string> after = 3;
}
message DefinitionBackfillDryRun {
  string object_type = 1;
  string dataset_id = 2;
  string branch = 3;
  int64 rows = 4;
  int64 rows_changed = 5;
  repeated DefinitionBackfillSample samples = 6;
  // True when the caller may not read the dataset's marking: counts only.
  bool samples_withheld = 7;
}
message DryRunDefinitionChangeBundleResponse {
  string bundle_digest = 1;
  repeated DefinitionBackfillDryRun runs = 2;
  // Object types with a backfill but no backing dataset to run it on.
  repeated string unbacked_object_types = 3;
}

