// is a no-op. Audited in the rule object's change log.
message PutTrustScoringRuleRequest {
  string rule_json = 1;
  string expected_revision_digest = 2;
}
message PutTrustScoringRuleResponse { TrustScoringRuleRevision rule = 1; }
message GetTrustScoringRuleRequest { string namespace = 1; }
message GetTrustScoringRuleResponse { TrustScoringRuleRevision rule = 1; }
