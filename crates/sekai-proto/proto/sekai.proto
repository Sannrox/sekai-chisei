message DefinitionProposal {
  string contract_version = 1;
  string namespace = 2;
  string branch_id = 3;
  string proposal_id = 4;
  string base_digest = 5;
  string candidate_digest = 6;
  string proposal_digest = 7;
  repeated string eval_plan_digests = 8;
  repeated string named_foreign_digests = 9;
  repeated DefinitionProposalApproval approvals = 10;
  string status = 11; // open | merged | closed
  string created_by = 12;
  int64 created_at_ms = 13;
  int64 updated_at_ms = 14;
  string receipt_id = 15; // set only after merge
  string close_reason_code = 16; // set only after close
  string restored_from_digest = 17; // prior published revision restored by this proposal
  string migration_plan_digest = 18; // pin required when rollback would drop live properties
  // Approved as a new major revision: may break blocking consumer bindings.
  bool major_revision = 19;
  // Package digest of the definition package this proposal imports (#1700).
  string source_package_digest = 20;
}

message CreateDefinitionProposalRequest {
  string namespace = 1;
