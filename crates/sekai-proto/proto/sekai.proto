  rpc Traverse(TraverseRequest) returns (TraverseResponse);
  // Governed media uploads (#1623, ADR 0123). Experimental. A client
  // begins an upload with the file's size and SHA-256, sends it in chunks
  // (resuming from `received_bytes` after an interruption), and completes
  // it. Completing checks the SHA-256 and returns a `sekai-media:`
  // reference to a governed `media_attachment` object; reading the file is
  // a read of that object. The same idempotency key returns the same upload.
  rpc BeginMediaUpload(BeginMediaUploadRequest) returns (MediaUploadStatus);
  rpc UploadMediaChunk(UploadMediaChunkRequest) returns (MediaUploadStatus);
  rpc CompleteMediaUpload(CompleteMediaUploadRequest) returns (MediaUploadStatus);
  rpc GetMediaUpload(GetMediaUploadRequest) returns (MediaUploadStatus);
  rpc ReadMedia(ReadMediaRequest) returns (ReadMediaResponse);
  // Offline sync scopes (#1632, ADR 0124), contract `sekai.sync/v1`.
  // Experimental. A principal defines a scope, takes a snapshot of it, then
  // reads deltas from the cursor the snapshot ends with. Every object passes
  // the online read checks and is projected per property.
  rpc PutSyncScope(PutSyncScopeRequest) returns (SyncScopeResponse);
  rpc ReadSyncSnapshot(ReadSyncSnapshotRequest) returns (ReadSyncSnapshotResponse);
  rpc ReadSyncDeltas(ReadSyncDeltasRequest) returns (ReadSyncDeltasResponse);
