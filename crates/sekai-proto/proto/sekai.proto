  bool ok = 1;
  bool found = 2;
  bool hash_ok = 3;            // stored hashes match recomputation
  bool replay_ok = 4;          // pinned policy replayed over inputs re-derives the decision
  string replayed_decision = 5;
  bool decision_linked = 6;    // linked audit decision binds this attestation back
  string error = 7;
}
// Closed object-security v1 predicate on an Action type (#883 / ADR 0077).
message ActionSubmissionCriterion {
  string criterion_id = 1;
  // allow_all | subject_equals_property | required_scope_equals | property_equals
  string kind = 2;
  string property = 3;
  string value = 4;
}
// Governed Action type registry (#396 / research #395).
message GovernedActionType {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  string description = 4;
  string parameter_schema_json = 5;
  repeated string allowed_effect_kinds = 6;
  string policy_scope = 7;
  string budget_scope = 8;
  bool enabled = 9;
  string created_by = 10;
  int64 created_at_ms = 11;
  int64 updated_at_ms = 12;
  int64 disabled_at_ms = 13;
  // Admitted object kind this type may create or update. Empty means admit-only.
  string object_kind = 14;
  // create | update when object_kind is set. Empty means admit-only.
  string object_mutation = 15;
  repeated ActionSubmissionCriterion submission_criteria = 16;
  // Subset of allowed_effect_kinds to materialize. Empty means all allowed kinds.
  repeated string declared_effect_kinds = 17;
  // Additive System One Function bind. Empty means preview does not fill.
  string system_one_json = 18;
  // Principals who may grant or deny a parked instance. Empty means namespace
  // administrators. A submitter never decides their own instance (#1084).
  repeated string approvers = 19;
  // Review queue for parked instances (#1455). Empty queue_id means no queue.
  string review_queue_id = 20;
  int64 review_sla_ms = 21;
  // auto_deny | reassign | empty
  string review_escalate = 22;
  string review_escalate_to = 23;
  string review_threshold_param = 24;
  int64 review_threshold = 25;
  repeated string review_pool = 26;
  repeated string review_agent_reviewers = 27;
  // How an Action prepared offline (#1580) meets a bound object that changed
  // since the device read it: reject_any (empty means this), reject_touched,
  // or last_writer_wins for last_writer_wins_properties.
  string offline_conflict = 28;
  repeated string last_writer_wins_properties = 29;
}
// What a device saw when it prepared an Action offline (#1580, ADR 0127).
message OfflineSubmission {
  int64 prepared_at_ms = 1;
  // The bound object's updated time when the device read it.
  int64 base_updated_ms = 2;
  // What the device saw for each field the Action writes: its properties,
  // and `name` when the Action renames. A list, not a map, so the request
  // re-encodes to the bytes the device proof signed.
  repeated BaseProperty base_properties = 3;
  // The offline lease the device prepared under, if any.
  string lease_id = 4;
  // Set by the plane from the device-bound assertion; ignored on submit.
  string device_id = 5;
}
// One field as the device saw it. An unset value means it was absent.
message BaseProperty {
  string name = 1;
  optional string value = 2;
}
// Why an offline Action was not applied: its object changed past the base.
message ActionConflict {
  string object_id = 1;
  int64 base_updated_ms = 2;
  int64 current_updated_ms = 3;
  // Written properties whose current values differ from the base. Empty
  // under reject_any, which compares versions only.
  repeated string properties = 4;
}
message PutGovernedActionTypeRequest { GovernedActionType type = 1; string request_id = 2; }
message PutGovernedActionTypeResponse { GovernedActionType type = 1; }
message GetGovernedActionTypeRequest { string namespace = 1; string type_id = 2; string version = 3; }
message GetGovernedActionTypeResponse { GovernedActionType type = 1; }
message ListGovernedActionTypesRequest {
  string namespace = 1;
  string type_id = 2;
  bool enabled_only = 3;
}
message ListGovernedActionTypesResponse { repeated GovernedActionType types = 1; }
message SetGovernedActionTypeEnabledRequest {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  bool enabled = 4;
  string request_id = 5;
}
message SetGovernedActionTypeEnabledResponse { GovernedActionType type = 1; }

// Governed ActionInstance admission (#397 / research #395).
message ActionInstance {
  string instance_id = 1;
  string namespace = 2;
  string type_id = 3;
  string version = 4;
  string principal = 5;
  // JSON object. Untrusted producer/user content — plane never treats as instructions.
  string parameters_json = 6;
  string request_digest = 7;
  string idempotency_key = 8;
  // Bound operation correlation spine for receipts/harvest.
  string operation_id = 9;
  // admitted | denied | parked (awaiting an approver decision)
  string status = 10;
  string deny_reason = 11;
  repeated string evidence_submission_ids = 12;
  string policy_decision = 13;
  string budget_decision = 14;
  int64 created_at_ms = 15;
  int64 decided_at_ms = 16;
  // Bind + admitted parameter-body provenance. Empty when the type has no bind.
  string system_one_fill_json = 17;
  // Approver who decided a parked instance, and their decision (grant | deny).
  string decided_by = 18;
  string approval_decision = 19;
  // Review-queue placement when the type routed this park (#1455).
  string review_queue_id = 20;
  string review_assignee = 21;
  int64 review_sla_deadline_ms = 22;
  bool review_escalated = 23;
  bool agent_decision = 24;
  // Derived at admission from the bound object and the binding; reading the
  // instance needs clearance for it. Empty when unmarked.
  string marking = 25;
  // Set when the Action was prepared offline (#1580).
  OfflineSubmission offline = 26;
  // Set when an offline Action met a changed object; the instance is denied
  // with deny_reason offline_conflict.
  ActionConflict conflict = 27;
}
message SubmitActionInstanceRequest {
  string namespace = 1;
  string type_id = 2;
  string version = 3;
  string parameters_json = 4;
  string idempotency_key = 5;
  repeated string evidence_submission_ids = 6;
  // When set, becomes the bound operation_id and receipt spine. Empty mints op-gai-*.
  string request_id = 7;
  // Optional ontology binding copied onto operation.receipt/v1. Not parameter data.
  string ontology_digest = 8;
  // An Action prepared offline (#1580). Needs a device-bound assertion and
  // the device's proof over this request.
  OfflineSubmission offline = 9;
}
message SubmitActionInstanceResponse {
  ActionInstance instance = 1;
  bool replay = 2;
}
// Grant or deny a parked ActionInstance (#1084). Grant resumes the same
// instance through admission against current state; deny is terminal.
message DecideActionInstanceRequest {
  string instance_id = 1;
  // grant | deny
  string decision = 2;
  // Optional approver note, recorded in audit. Not parameter data.
  string reason = 3;
}
message DecideActionInstanceResponse {
  ActionInstance instance = 1;
  // True when this decision was already recorded; nothing changed.
  bool replay = 2;
}
// Object-change automation binding (#1092, ADR 0090). binding_json is the
// sekai.action-binding/v1 document: namespace, kind, ops, pinned type and
// version, run_as service principal, and a closed parameter mapping.
message PutActionBindingRequest {
  string binding_json = 1;
}
message PutActionBindingResponse {
  string binding_json = 1;
  uint64 revision = 2;
}
message RunActionBindingRequest {
  string namespace = 1;
  string binding_id = 2;
  // Maximum events read from the subscription in this run.
  int32 limit = 3;
}
message ActionBindingSubmission {
  string event_id = 1;
  string object_id = 2;
  string op = 3;
  // Empty when the event was skipped.
  string instance_id = 4;
  string status = 5;
  bool replay = 6;
  // Bounded reason when the event did not submit or admission refused it.
  string skipped_reason = 7;
}
message RunActionBindingResponse {
  // The subscription outcome: page, replayed, resnapshot_required,
  // disconnected, or revoked.
  string outcome = 1;
  string disconnect_reason = 2;
  string page_digest = 3;
  repeated ActionBindingSubmission submissions = 4;
  uint64 binding_revision = 5;
  // Always false: the subscription and the binding grant nothing.
  bool authority = 6;
}
// Ezu geofence-event automation binding (#1564, ADR 0121). binding_json is
// the sekai.fence-binding/v1 document: namespace, fences, event kinds,
// collection and object kind, pinned type and version, run_as service
// principal, and a closed parameter mapping.
message PutFenceBindingRequest {
  string binding_json = 1;
}
message PutFenceBindingResponse {
  string binding_json = 1;
  uint64 revision = 2;
}
message RunFenceBindingRequest {
  string namespace = 1;
  string binding_id = 2;
}
// What one Ezu event became, by its id (lsn, index).
message FenceBindingSubmission {
  uint64 lsn = 1;
  uint32 index = 2;
  string fence = 3;
  string entity = 4;
  string kind = 5;
  // Empty when the event was skipped.
  string instance_id = 6;
  string status = 7;
  bool replay = 8;
  string skipped_reason = 9;
}
message RunFenceBindingResponse {
  uint64 binding_revision = 1;
  repeated FenceBindingSubmission submissions = 2;
  // The Ezu id the binding has now read through; absent before any event.
  optional uint64 through_lsn = 3;
  uint32 through_index = 4;
  // Age of the oldest event this run read, 0 when there was nothing new.
  int64 lag_ms = 5;
  // The run read a full page; more events may be waiting.
  bool more = 6;
}

