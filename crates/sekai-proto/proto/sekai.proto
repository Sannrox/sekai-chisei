  string assertion_id = 1;
  int64 version = 2;
  string namespace = 3;
  string subject_id = 4;
  string predicate = 5;
  string object_ref = 6;
  string payload_json = 7;
  TemporalBound valid_from = 8;
  TemporalBound valid_to = 9;
  int64 recorded_from_revision = 10;
  int64 recorded_to_revision = 11; // 0 means open
  int64 recorded_at_ms = 12;
  int64 source_observed_at_ms = 13;
  string source_id = 14;
  string actor = 15;
  string evidence_ref = 16;
  string lineage_ref = 17;
  bool is_backfill = 18;
}
