  string candidate_digest = 5;
  repeated string eval_plan_digests = 6;
  repeated string named_foreign_digests = 7;
  string idempotency_key = 8;
  // Propose a new major revision. Once approved it may break blocking
  // consumer bindings; the flag is part of the approved proposal digest.
