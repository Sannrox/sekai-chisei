  string namespace = 1;
  string subject_id = 2;
  string predicate = 3; // empty = all predicates for subject
  int64 recorded_revision = 4; // 0 = latest committed
  int64 valid_at_ms = 5; // used when valid_at_kind = known
  string valid_at_kind = 6; // known | (empty = no domain-time filter)
  string unknown_bounds_policy = 7; // exclude (default) | include
  int32 limit = 8;
  string page_token = 9; // "assertion_id\\0version"
}
