message BeginMediaUploadRequest {
  string namespace = 1;
  // Scoped to the namespace and the uploader. Repeating a begin with the
  // same key and declaration returns the same upload.
  string idempotency_key = 2;
  // At most 64 MiB.
  uint64 size_bytes = 3;
  // Lowercase hex SHA-256 of the whole file.
  string sha256 = 4;
  // type/subtype, for example image/jpeg.
  string media_type = 5;
  string file_name = 6;
  // Classification marking of the file; empty for unmarked.
  string access_marking = 7;
}

message MediaUploadStatus {
  string upload_id = 1;
  uint64 size_bytes = 2;
  // Send the next chunk from here.
  uint64 received_bytes = 3;
  bool complete = 4;
  // `sekai-media:<object id>` once complete.
  string media_reference = 5;
}

message UploadMediaChunkRequest {
  string upload_id = 1;
  // Must equal the upload's received_bytes. A chunk the upload already holds
  // is accepted as a retry and changes nothing.
  uint64 offset = 2;
  // At most 1 MiB.
  bytes data = 3;
}

message CompleteMediaUploadRequest {
  string upload_id = 1;
}

message GetMediaUploadRequest {
  string upload_id = 1;
}

message ReadMediaRequest {
  string media_reference = 1;
  uint64 offset = 2;
  // Default and maximum 1 MiB.
  uint32 limit = 3;
}

message ReadMediaResponse {
  bytes data = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
  string media_type = 4;
  string file_name = 5;
  string access_marking = 6;
}

message SyncScopeLink {
  string relation = 1;
  // `outgoing` (default) or `incoming`.
  string direction = 2;
  // 1 or 2.
  uint32 max_hops = 3;
}

message PutSyncScopeRequest {
  // `sekai.sync/v1`.
  string contract_version = 1;
  string namespace = 2;
  string scope_id = 3;
  string kind = 4;
  // At most 4; eq, gt, gte, lt or lte.
  repeated PropertyFilter property_filters = 5;
  // Also sync the objects linked to the matches by one relation.
  SyncScopeLink link = 6;
  // The scope's quota of visible objects, at most 5000.
  uint32 max_objects = 7;
  // How long a client may show synced data without syncing again (#1633):
  // 0 for no limit, otherwise one minute to 366 days.
  int64 max_offline_age_ms = 8;
}

message SyncScopeResponse {
  string contract_version = 1;
  string namespace = 2;
  string scope_id = 3;
  uint32 max_objects = 4;
  int64 max_offline_age_ms = 5;
}

message ReadSyncSnapshotRequest {
  string contract_version = 1;
  string namespace = 2;
  string scope_id = 3;
  // Empty to start a snapshot; otherwise the previous next_page_token.
  string page_token = 4;
  // Default 50, at most 100.
  uint32 limit = 5;
}

message ReadSyncSnapshotResponse {
  string contract_version = 1;
  repeated Object objects = 2;
  // Empty on the last page.
  string next_page_token = 3;
  // Set on the last page: read deltas from here.
  string cursor = 4;
  // Members in the snapshot, including any no longer readable when sent.
  uint32 total_objects = 5;
  // Set on the last page when the scope has a maximum offline age: the
  // client must sync again before showing the data after this time.
  int64 offline_until_ms = 6;
  // The device was revoked (#1634): delete every synced object and the
  // cursor. No data comes with it.
  bool wipe_required = 7;
}

message ReadSyncDeltasRequest {
  string contract_version = 1;
  string namespace = 2;
  string scope_id = 3;
  string cursor = 4;
  // Most object changes (upserts and removals) in this read: default 50,
  // at most 100.
  uint32 limit = 5;
}

message ReadSyncDeltasResponse {
  string contract_version = 1;
  // Objects to store or replace, as an online read shows them.
  repeated Object upserts = 2;
  // Objects to drop: deleted, hidden, or out of the scope.
  repeated string removed_object_ids = 3;
  // Read the next deltas from here. The previous cursor stays valid until
  // this one is used.
  string cursor = 4;
  // More changes are waiting.
  bool more = 5;
  // The cursor cannot continue (expired, scope changed, or a filter the
  // caller may no longer query): discard the replica and take a new
  // snapshot. A change in what the caller may read does not end a cursor;
  // it arrives as purges.
  bool resnapshot_required = 6;
  // Data the caller may no longer read (#1633): delete it. An entry without
  // properties is a whole object (also in removed_object_ids); one with
  // properties names those the object, upserted here, no longer shows.
  repeated SyncPurge purges = 7;
  // As in the snapshot: sync again before showing data after this time.
  // Set only when this read leaves nothing pending (`more` false); until
  // then the previous deadline holds.
  int64 offline_until_ms = 8;
  // As in the snapshot: the device was revoked; wipe, with no data.
  bool wipe_required = 9;
}

message SyncPurge {
  string object_id = 1;
  repeated string properties = 2;
}
