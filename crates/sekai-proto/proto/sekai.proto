syntax = "proto3";
package sekai;

// --- Messages ---

message Object {
  string id = 1;
  string kind = 2;
  string name = 3;
  string namespace = 4;
  string external_id = 5;
  map<string, string> properties = 6;
  int64 created = 7;
  int64 updated = 8;
}

message Link {
  string id = 1;
  string from_id = 2;
  string to_id = 3;
  string relation = 4;
  int64 created = 5;
}

message ListFilter {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  repeated PropertyFilter property_filters = 4;
  int32 limit = 5;
  int32 offset = 6;
  string order_by = 7;
  bool descending = 8;
  repeated string interface_filter = 9;
}

message PropertyFilter {
  string key = 1;
  string op = 2;
  string value = 3;
}

message GraphQuery {
  string start_id = 1;
  string start_external_id = 2;
  repeated string relations = 3;
  string direction = 4;
  int32 max_depth = 5;
  repeated string kind_filter = 6;
  map<string, string> property_filter = 7;
  repeated string interface_filter = 8;
}

message GraphResult {
  repeated Object objects = 1;
  repeated Link links = 2;
}

message ObjectType {
  string kind = 1;
  string description = 2;
  repeated PropertyDef properties = 3;
  bool is_builtin = 4;
  repeated string implements = 5;
}

message InterfaceDef {
  string name = 1;
  string description = 2;
  repeated PropertyDef properties = 3;
  bool is_builtin = 4;
}

message PropertyDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
  string link_kind = 6;
  string compute_expr = 7;
  string classification = 8;
  repeated StructFieldDef struct_fields = 9;
}

message StructFieldDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
  repeated string enum_values = 5;
}

// Ontology layer (issue #141): first-class semantic concepts above the graph.
message OntologyProperty {
  string name = 1;
  string type = 2;
  bool required = 3;
  string description = 4;
}

message Cardinality {
  uint32 min = 1;
  optional uint32 max = 2;
}

message OntologyClass {
  string name = 1;
  string description = 2;
  repeated string superclasses = 3;
  repeated string equivalent_classes = 4;
  repeated string disjoint_classes = 5;
  repeated OntologyProperty properties = 6;
  bool is_builtin = 7;
  string mapped_kind = 8;
}

message OntologyRelation {
  string name = 1;
  string description = 2;
  string domain = 3;
  string range = 4;
  Cardinality cardinality = 5;
  string inverse = 6;
  bool transitive = 7;
  bool is_builtin = 8;
  string mapped_relation = 9;
}

message Function {
  string name = 1;
  string description = 2;
  repeated FuncParam params = 3;
  repeated PipelineStep pipeline = 4;
  int64 created = 5;
}

message FuncParam {
  string name = 1;
  string type = 2;
  bool required = 3;
}

message PipelineStep {
  string op = 1;
  string kind = 2;
  string property = 3;
  string value = 4;
  string relation = 5;
  string dir = 6;
  string func = 7;
  string field = 8;
  string as = 9;
}

message FunctionResult {
  repeated Object objects = 1;
  map<string, string> aggregates = 2;
}

message Dataset {
  string id = 1;
  string name = 2;
  repeated ColumnDef columns = 3;
  string object_id = 4;
  int64 created = 5;
}

message ColumnDef {
  string name = 1;
  string type = 2;
  string classification = 3;
}

message RowFilter {
  string column = 1;
  string op = 2;
  string value = 3;
}

message RowQuery {
  repeated RowFilter filters = 1;
  repeated string columns = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message VirtualTable {
  string id = 1;
  string name = 2;
  string dataset_id = 3;
  repeated RowFilter filters = 4;
  repeated string columns = 5;
  int64 created = 6;
}

message Grant {
  string id = 1;
  string object_id = 2;
  string principal = 3;
  string role = 4;
  int64 created = 5;
}

message Decision {
  string id = 1;
  int64 timestamp = 2;
  string actor = 3;
  string action = 4;
  string reason = 5;
  map<string, string> evidence = 6;
  string target_id = 7;
  string outcome = 8;
}

message ObjectChange {
  string id = 1;
  string object_id = 2;
  string field = 3;
  string old_value = 4;
  string new_value = 5;
  string changed_by = 6;
  int64 timestamp = 7;
}

message ActionRequest {
  string action = 1;
  map<string, string> params = 2;
  // Advisory display label only. Authorization uses the authenticated caller
  // principal from request metadata, not this field.
  string actor = 3;
}

message ActionResult {
  string action = 1;
  string message = 2;
  bool dry_run = 3;              // set when the call was a dry run (no mutation)
  repeated string planned_ops = 4; // ops that would run, in order
  string decision = 5;          // resolved policy decision: allow|deny|require_approval
  string approval_id = 6;       // set when the action was held for approval (Phase B)
}

message ActionParamDef {
  string name = 1;
  string type = 2;
  bool required = 3;
  repeated string enum_values = 4;
}

message ActionOp {
  string op = 1;
  string property = 2;
  string value_from = 3;
  string relation = 4;
}

message ActionTypeDef {
  string name = 1;
  string description = 2;
  repeated ActionParamDef params = 3;
  repeated ActionOp ops = 4;
  string target_kind = 5;
  int64 created = 6;
  // Optional purpose required to invoke this action. Empty means no purpose gate.
  string required_purpose = 7;
}

// A versioned description of an existing native query, retrieval, or action
// surface. Object and action schemas reuse the canonical definitions above;
// the catalog does not introduce a second schema language.
message CapabilityEntry {
  string name = 1;
  string description = 2;
  string kind = 3; // query | retrieval | action
  string lifecycle_state = 4; // preview | active | deprecated | disabled | revoked
  string contract_version = 5;
  string minimum_compatible_version = 6;
  string maximum_compatible_version = 7;
  string replacement_capability = 8;
  string input_type = 9;  // canonical protobuf message name
  string output_type = 10; // canonical protobuf message name
  repeated string required_scopes = 11;
  repeated string policy_decision_points = 12;
  string risk_class = 13;
  string approval_behavior = 14; // none | may_require | required
  repeated CapabilityLimit limits = 15;
  ObjectType object_type = 16;
  ActionTypeDef action_type = 17;
  repeated string evidence_requirements = 18;
  // Product tier for discovery filters (#386 / research #383): core | advanced | experimental.
  // Empty means untagged (treated as advanced for filtering).
  string product_tier = 19;
}

message CapabilityLimit {
  string name = 1;
  uint64 value = 2;
}

message DiscoverCapabilitiesRequest {
  string namespace = 1;
  string contract_version = 2; // empty negotiates the latest supported version
  string catalog_version = 3; // pins pagination to an observed snapshot
  uint32 page_size = 4; // defaults to 50 and is capped at 200
  string page_token = 5;
  // Optional product-tier filter (#386): empty = all tiers; "core" returns the
  // starter pack only (core product capabilities). Values: core | advanced | experimental.
  string product_tier_filter = 6;
}

message DiscoverCapabilitiesResponse {
  repeated CapabilityEntry capabilities = 1;
  string contract_version = 2;
  string catalog_version = 3;
  string next_page_token = 4;
  uint32 total_size = 5;
  string cache_scope = 6; // always authorization_context
}

// Closed declarative capability-package content. definition_json accepts only
// the kind-specific identifier, enum, list, and bounded-integer fields.
message CapabilityPackageComponent {
  string kind = 1;
  string name = 2;
  string definition_json = 3;
}

message CapabilityPackageSignature {
  string algorithm = 1; // ed25519
  string signer_identity = 2;
  string key_id = 3;
  string signature_b64 = 4;
}

message CapabilityPackageManifest {
  string manifest_version = 1;
  string name = 2;
  string version = 3;
  repeated CapabilityPackageComponent components = 4;
  // Optional; not part of the unsigned digest used for verification.
  CapabilityPackageSignature signature = 5;
}

message CapabilityPackageTrustPolicy {
  string namespace = 1;
  // unsigned_allowed (default) or signed
  string required_trust_level = 2;
  string updated_by = 3;
  int64 updated_at_ms = 4;
}

message CapabilityPackageSigner {
  string namespace = 1;
  string identity = 2;
  string key_id = 3;
  string public_key_b64 = 4;
  string created_by = 5;
  int64 created_at_ms = 6;
}

message SetCapabilityPackageTrustPolicyRequest {
  string namespace = 1;
  string required_trust_level = 2;
  string request_id = 3;
}
message SetCapabilityPackageTrustPolicyResponse {
  CapabilityPackageTrustPolicy policy = 1;
}
message GetCapabilityPackageTrustPolicyRequest { string namespace = 1; }
message GetCapabilityPackageTrustPolicyResponse {
  CapabilityPackageTrustPolicy policy = 1;
}
message PutCapabilityPackageSignerRequest {
  string namespace = 1;
  string identity = 2;
  string key_id = 3;
  string public_key_b64 = 4;
  string request_id = 5;
}
message PutCapabilityPackageSignerResponse {
  CapabilityPackageSigner signer = 1;
}
message ListCapabilityPackageSignersRequest { string namespace = 1; }
message ListCapabilityPackageSignersResponse {
  repeated CapabilityPackageSigner signers = 1;
}

message CapabilityPackageInstallation {
  string namespace = 1;
  string package_name = 2;
  string current_version = 3;
  string previous_version = 4;
  string state = 5;
  string installed_by = 6;
  string updated_by = 7;
  int64 installed_at_ms = 8;
  int64 updated_at_ms = 9;
}

message CapabilityPackageEvent {
  int64 sequence = 1;
  string namespace = 2;
  string package_name = 3;
  string package_version = 4;
  string action = 5;
  string actor = 6;
  string request_id = 7;
  string manifest_digest = 8;
  string evidence = 9;
  int64 recorded_at_ms = 10;
}

message InstallCapabilityPackageRequest { string namespace = 1; CapabilityPackageManifest manifest = 2; string request_id = 3; }
message InstallCapabilityPackageResponse { CapabilityPackageInstallation installation = 1; }
message UpgradeCapabilityPackageRequest { string namespace = 1; CapabilityPackageManifest manifest = 2; string request_id = 3; }
message UpgradeCapabilityPackageResponse { CapabilityPackageInstallation installation = 1; }
// Legacy per-action transition request (shims for Evaluate/Rollback/Disable/Uninstall).
message CapabilityPackageTransitionRequest { string namespace = 1; string package_name = 2; string request_id = 3; }
message CapabilityPackageTransitionResponse { CapabilityPackageInstallation installation = 1; }
message GetCapabilityPackageRequest { string namespace = 1; string package_name = 2; }
message GetCapabilityPackageResponse { CapabilityPackageInstallation installation = 1; CapabilityPackageManifest manifest = 2; repeated CapabilityPackageEvent events = 3; }
message EvaluateCapabilityPackageResponse { bool passed = 1; }
message UninstallCapabilityPackageResponse {}

// Unified product transition path (#389 / #383 S5). Prefer this over peer RPCs.
enum CapabilityPackageTransitionAction {
  CAPABILITY_PACKAGE_TRANSITION_ACTION_UNSPECIFIED = 0;
  CAPABILITY_PACKAGE_TRANSITION_ACTION_EVALUATE = 1;
  CAPABILITY_PACKAGE_TRANSITION_ACTION_UPGRADE = 2;
  CAPABILITY_PACKAGE_TRANSITION_ACTION_ROLLBACK = 3;
  CAPABILITY_PACKAGE_TRANSITION_ACTION_DISABLE = 4;
  CAPABILITY_PACKAGE_TRANSITION_ACTION_UNINSTALL = 5;
}
message TransitionCapabilityPackageRequest {
  string namespace = 1;
  string package_name = 2;
  string request_id = 3;
  CapabilityPackageTransitionAction action = 4;
  // Required when action == UPGRADE; ignored otherwise.
  CapabilityPackageManifest manifest = 5;
}
message TransitionCapabilityPackageResponse {
  // Present for upgrade/rollback/disable.
  CapabilityPackageInstallation installation = 1;
  // Meaningful when action == EVALUATE.
  bool evaluate_passed = 2;
}

// Fixed graph-backed profile for immutable requirement, invariant, and waiver
// facts. The contract is domain-neutral: subject profiles and references remain
// opaque integration-owned identifiers, while evaluation semantics are bound
// later by Chisei evaluation plans.
message GovernedFactApplicability {
  repeated string subject_profiles = 1;
  repeated string subject_refs = 2;
}

message InvariantVerificationContract {
  string predicate_kind = 1;
  string input_schema = 2;
  string result_schema = 3;
  repeated string evidence_types = 4;
}

message GovernedFactVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string fact_id = 4;
  string version = 5;
  string fact_type = 6; // requirement | invariant
  string statement = 7;
  GovernedFactApplicability applicability = 8;
  InvariantVerificationContract verification = 9;
  repeated string requirement_version_ids = 10;
  // Exact IDs of authorized projected external_evidence graph objects.
  repeated string evidence_refs = 11;
  string source_ref = 12;
  int64 effective_from_ms = 13;
  string supersedes_object_id = 14;
  string content_digest = 15;
  string created_by = 16;
  int64 created_at_ms = 17;
  string access_marking = 18;
  string status = 19; // active | retired
}

message GovernedWaiverVersion {
  string contract_version = 1;
  string object_id = 2;
  string namespace = 3;
  string waiver_id = 4;
  string version = 5;
  repeated string invariant_version_ids = 6;
  GovernedFactApplicability applicability = 7;
  string reason = 8;
  repeated string evidence_refs = 9;
  string source_ref = 10;
  int64 valid_from_ms = 11;
  int64 expires_at_ms = 12;
  string supersedes_object_id = 13;
  string content_digest = 14;
  string created_by = 15;
  int64 created_at_ms = 16;
  string access_marking = 17;
}

message GovernedFactProfile {
  string object_id = 1;
  string contract_version = 2;
  string namespace = 3;
  string content_digest = 4;
  string applied_by = 5;
  int64 applied_at_ms = 6;
}

message ApplyGovernedFactProfileRequest {
  string namespace = 1;
  string contract_version = 2;
}
message ApplyGovernedFactProfileResponse {
  GovernedFactProfile profile = 1;
}

message PutGovernedFactVersionRequest {
  GovernedFactVersion fact = 1;
}
message PutGovernedFactVersionResponse {
  GovernedFactVersion fact = 1;
}
message GetGovernedFactVersionRequest { string object_id = 1; }
message GetGovernedFactVersionResponse {
  GovernedFactVersion fact = 1;
}

message PutGovernedWaiverVersionRequest {
  GovernedWaiverVersion waiver = 1;
}
message PutGovernedWaiverVersionResponse {
  GovernedWaiverVersion waiver = 1;
}
message GetGovernedWaiverVersionRequest { string object_id = 1; }
message GetGovernedWaiverVersionResponse {
  GovernedWaiverVersion waiver = 1;
}

message ResolveInvariantSetRequest {
  string namespace = 1;
  string subject_profile = 2;
  string subject_ref = 3;
  int64 evaluation_time_ms = 4;
  uint32 max_items = 5;
}
message ResolvedInvariantSet {
  string contract_version = 1;
  string set_id = 2;
  string set_digest = 3;
  string profile_digest = 4;
  string namespace = 5;
  string subject_profile = 6;
  string subject_ref = 7;
  int64 evaluation_time_ms = 8;
  repeated GovernedFactVersion requirements = 9;
  repeated GovernedFactVersion invariants = 10;
  repeated GovernedWaiverVersion waivers = 11;
}
message ResolveInvariantSetResponse {
  ResolvedInvariantSet invariant_set = 1;
}

message LineageNode {
  Object object = 1;
  string role = 2;
  bool ephemeral = 3;
}

message LineageEdge {
  string from = 1;
  string to = 2;
  string relation = 3;
}

message LineageResult {
  repeated LineageNode nodes = 1;
  repeated LineageEdge edges = 2;
  bool truncated = 3;
}

// --- Request/Response wrappers ---

// Optional lease_precondition unifies the product mutation path with generation-
// fenced writes (#388). When unset, behavior matches the historical unguarded
// RPCs. When set, semantics match GuardedCreate/Update/DeleteObject (which remain
// as shims).
message CreateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message CreateObjectResponse { Object object = 1; }
message GetObjectRequest { string id = 1; }
message GetObjectResponse { Object object = 1; }
message UpdateObjectRequest {
  Object object = 1;
  LeasePrecondition lease_precondition = 2;
}
message UpdateObjectResponse { Object object = 1; }
message DeleteObjectRequest {
  string id = 1;
  LeasePrecondition lease_precondition = 2;
}
message DeleteObjectResponse {}
message ListObjectsRequest { ListFilter filter = 1; }
message ListObjectsResponse { repeated Object objects = 1; int32 total = 2; }
message FindByExternalIdRequest { string external_id = 1; }
message FindByPropertyRequest { string kind = 1; string key = 2; string value = 3; }

message ObjectSet {
  string id = 1;
  string name = 2;
  string description = 3;
  ListFilter filter = 4;
  string owner_principal = 5;
  int64 created = 6;
}
message CreateObjectSetRequest { ObjectSet object_set = 1; }
message CreateObjectSetResponse { ObjectSet object_set = 1; }
message ListObjectSetsRequest {}
message ListObjectSetsResponse { repeated ObjectSet object_sets = 1; }
message DeleteObjectSetRequest { string id = 1; }
message DeleteObjectSetResponse {}
message ResolveObjectSetRequest {
  string id = 1;
  int32 limit = 2;
  optional int32 offset = 3;
}

message CreateLinkRequest { Link link = 1; bool fail_if_exists = 2; }
message CreateLinkResponse { Link link = 1; }
message DeleteLinkRequest { string id = 1; }
message DeleteLinkResponse {}
message GetLinksRequest { string object_id = 1; string relation = 2; string direction = 3; }
message GetLinksResponse { repeated Link links = 1; }
message GetLinkedObjectsRequest { string object_id = 1; string relation = 2; string direction = 3; }
message GetLinkedObjectsResponse { repeated Object objects = 1; }

message TraverseRequest { GraphQuery query = 1; }
message TraverseResponse { GraphResult result = 1; }

// A bounded, governed context-retrieval root. Exactly one field must be set.
message ContextRoot {
  string object_id = 1;
  string external_id = 2;
  string link_id = 3;
}

message RetrieveContextRequest {
  repeated ContextRoot roots = 1;
  repeated string relations = 2;
  string direction = 3; // outgoing | incoming | both; empty defaults to both
  uint32 max_depth = 4; // 0 is roots-only; values above 3 are capped
  uint32 max_objects = 5; // 0 defaults to 20; absolute cap is 100
  uint32 max_links = 6; // 0 defaults to 40 when expanding; cap is 200
  repeated string kind_filter = 7;
  string reasoning_mode = 8; // empty/asserted_only | entailment
  uint32 max_source_rows = 9; // 0 defaults to 200; cap is 1000
  uint32 max_derived_rows = 10; // 0 defaults to 100; cap is 500
  uint32 max_derivation_steps = 11; // 0 defaults to 12; cap is 32
  uint32 max_time_ms = 12; // 0 defaults to 100; cap is 1000
  uint64 max_explanation_bytes = 13; // 0 defaults to 1 MiB; cap is 16 MiB
}

message ContextDerivationStep {
  string kind = 1; // asserted | derived
  string relation = 2;
  string from_id = 3;
  string to_id = 4;
  repeated string source_fact_ids = 5;
  string ontology_revision = 6;
  string rule = 7; // root | graph_link | mapping | subclass | equivalence | transitive
}

message ContextExplanation {
  repeated ContextDerivationStep steps = 1;
  repeated string source_fact_ids = 2;
  string ontology_revision = 3;
  bool derived = 4;
}

message ContextCandidate {
  Object object = 1;
  uint32 depth = 2;
  string via_relation = 3;
  double affinity = 4;
  ContextExplanation explanation = 5;
}

message RetrieveContextResponse {
  repeated ContextCandidate candidates = 1;
  repeated Link links = 2;
  bool truncated = 3;
  uint32 unresolved_roots = 4;
  uint32 denied_objects = 5;
  uint32 truncated_objects = 6;
  uint32 truncated_links = 7;
  repeated string truncation_reasons = 8;
  uint32 source_rows = 9;
  uint32 derived_rows = 10;
  string ontology_revision = 11;
}

// Shared hybrid retrieval candidate envelope (#360 / research #152).
// Scores are only comparable within the same score_kind. Similarity never
// mints durable object identities; entity_kind/entity_id are set only when a
// source of truth already asserts the identifier.
message HybridEntityRef {
  // object | evidence_submission | link
  string kind = 1;
  string id = 2;
}

message HybridAuthzContext {
  string namespace = 1;
  // Authenticated principal class/label used for the re-check (not a grant).
  string principal_class = 2;
  // Classification ceiling applied, if any.
  string classification_ceiling = 3;
}

message HybridCandidate {
  // e.g. text.fts5, graph.retrieve_context
  string representation_id = 1;
  // e.g. sqlite.text_fts5
  string source = 2;
  // Index generation and/or content hash, e.g. gen:3#sha256...
  string source_version = 3;
  double score = 4;
  // e.g. text.fts5_bm25/v1 (higher is better for FTS BM25 as -bm25(table))
  string score_kind = 5;
  HybridEntityRef entity_ref = 6;
  HybridAuthzContext authz_context = 7;
  bool truncated = 8;
  // Disclosed responses normally omit denied material; reserved for accounting.
  bool denied = 9;
}

// Lexical text search over the rebuildable SQLite FTS5 projection (#360).
// Does not perform late fusion (see #361). Authz is re-checked per hit.
message SearchTextRequest {
  string query = 1;
  // Optional namespace filter; empty means all namespaces the principal may see.
  string namespace = 2;
  // all | evidence | object_props (empty defaults to all)
  string source_kinds = 3;
  // 0 defaults to 20; absolute cap is 100
  uint32 max_candidates = 4;
  // 0 defaults to 100; absolute cap is 1000
  uint32 max_time_ms = 5;
  // When true, rebuild the FTS projection from sources of truth before search.
  bool rebuild = 6;
}

message SearchTextResponse {
  repeated HybridCandidate candidates = 1;
  string representation_id = 2;
  string source_version = 3;
  bool truncated = 4;
  repeated string truncation_reasons = 5;
  // Count of hits omitted after authz re-check or stale/deleted source.
  // Never includes secret names.
  uint32 denied_count = 6;
  uint32 scanned = 7;
}

// Late-fusion hybrid retrieval plan (#361 / research #152 phase B).
// Callers must name representations explicitly. fusion_profile is required
// when more than one representation is selected. Pure graph callers should
// continue to use RetrieveContext (unchanged).
message HybridGraphParams {
  repeated ContextRoot roots = 1;
  repeated string relations = 2;
  string direction = 3; // outgoing | incoming | both; empty defaults to both
  uint32 max_depth = 4;
  uint32 max_objects = 5;
  uint32 max_links = 6;
  repeated string kind_filter = 7;
  string reasoning_mode = 8; // empty/asserted_only | entailment
  uint32 max_source_rows = 9;
  uint32 max_derived_rows = 10;
  uint32 max_derivation_steps = 11;
  uint64 max_explanation_bytes = 12;
}

message HybridTextParams {
  string query = 1;
  // Optional namespace filter; empty means all namespaces the principal may see.
  string namespace = 2;
  // all | evidence | object_props (empty defaults to all)
  string source_kinds = 3;
  // When true, rebuild the FTS projection from sources of truth before search.
  bool rebuild = 4;
}

message HybridRetrieveRequest {
  // Explicit representation ids (graph.retrieve_context, text.fts5). Non-empty.
  repeated string representations = 1;
  HybridGraphParams graph = 2;
  HybridTextParams text = 3;
  // Required when len(representations) > 1.
  // e.g. late_fusion.rrf/v1 | late_fusion.graph_priority/v1
  string fusion_profile = 4;
  // 0 defaults to 40; absolute cap is 200
  uint32 max_candidates = 5;
  // 0 defaults to 20; absolute cap is 100
  uint32 max_per_representation = 6;
  // Shared wall-clock budget across adapters; 0 defaults to 100; cap is 1000
  uint32 max_time_ms = 7;
}

message HybridAdapterResult {
  string representation_id = 1;
  // ok | truncated | denied_empty | error
  string status = 2;
  repeated string truncation_reasons = 3;
  // Stable code when status=error (e.g. invalid_argument, storage, unavailable)
  string error_code = 4;
  // Non-sensitive message; never includes hidden object names
  string error_message = 5;
  uint32 candidate_count = 6;
  uint32 denied_count = 7;
}

message HybridRetrieveResponse {
  repeated HybridCandidate candidates = 1;
  repeated HybridAdapterResult adapter_results = 2;
  string fusion_profile = 3;
  bool truncated = 4;
  repeated string truncation_reasons = 5;
}

// Versioned multi-hop pattern plan IR (#375 / research #145).
// Read-only, asserted graph only in v1. Ephemeral plans (not stored).
// No SQL / SPARQL / Cypher dialect. Existing Traverse / RetrieveContext
// remain unchanged for single-frontier / context callers.
message PatternPlanBounds {
  // Max expand_edge steps in the plan. 0 defaults to 3; absolute cap is 3.
  uint32 max_depth = 1;
  // Max result binding rows. 0 defaults to 20; absolute cap is 100.
  uint32 max_rows = 2;
  // Wall-clock budget. 0 defaults to 100; absolute cap is 1000.
  uint32 max_time_ms = 3;
  // Approximate binding-state memory. 0 defaults to 1 MiB; cap is 16 MiB.
  uint64 max_memory_bytes = 4;
  // Max edges examined. 0 defaults to 200; absolute cap is 1000.
  uint32 max_source_rows = 5;
}

message PatternMatchNode {
  // Required variable name (ASCII identifier).
  string var = 1;
  // Exactly one of object_id / external_id must be set.
  string object_id = 2;
  string external_id = 3;
  // Optional kind constraint after resolve (empty = any).
  string kind = 4;
}

message PatternExpandEdge {
  string from_var = 1;
  string to_var = 2;
  // Required single relation name (asserted graph).
  string relation = 3;
  // outgoing | incoming; empty defaults to outgoing. "both" is rejected.
  string direction = 4;
  repeated string kind_filter = 5;
}

message PatternBind {
  // Project these variables into each result row (wire order).
  // Empty means project all bound vars in first-definition order.
  repeated string vars = 1;
}

message PatternStep {
  // Exactly one of match_node / expand_edge / bind must be set.
  PatternMatchNode match_node = 1;
  PatternExpandEdge expand_edge = 2;
  PatternBind bind = 3;
}

message PatternPlan {
  // Must be "pattern_plan/v1".
  string version = 1;
  PatternPlanBounds bounds = 2;
  repeated PatternStep steps = 3;
}

message PatternBinding {
  // Variable name -> object id for projected vars.
  map<string, string> vars = 1;
  // Optional full objects keyed by variable name when include_objects is set.
  map<string, Object> objects = 2;
}

message ExecutePatternPlanRequest {
  PatternPlan plan = 1;
  // When true, include full Object payloads for projected vars.
  bool include_objects = 2;
}

message ExecutePatternPlanResponse {
  string plan_version = 1;
  repeated PatternBinding rows = 2;
  bool truncated = 3;
  // Non-sensitive reasons only (max_rows, max_time_ms, max_source_rows,
  // max_memory_bytes). Never includes object/relation secret names.
  repeated string truncation_reasons = 4;
  // Edges examined under authorization. Does not count denied targets as hits.
  uint32 source_rows = 5;
}

message PatternExplainStep {
  uint32 index = 1;
  // match_node | expand_edge | bind
  string op = 2;
  // Deterministic plan-shape summary (caller's IR only; no path counts).
  string summary = 3;
  repeated string vars_in = 4;
  repeated string vars_out = 5;
}

message ExplainPatternPlanRequest {
  PatternPlan plan = 1;
}

message ExplainPatternPlanResponse {
  string plan_version = 1;
  PatternPlanBounds bounds = 2;
  repeated PatternExplainStep steps = 3;
  uint32 expand_edge_count = 4;
  repeated string projected_vars = 5;
}

// Non-authoritative scenario overlay (#362 / research #148). Session is
// request-scoped: create overlay, apply ordered hypothesis deltas, project a
// domain-neutral impact set. Never mutates canonical objects/links/temporal
// assertions. Epistemic class is always "hypothesis".
message ScenarioDelta {
  // Caller-supplied stable id referenced from impact explanation steps.
  string id = 1;
  // set_property | remove_property | add_link | remove_link
  string op = 2;
  string object_id = 3;
  string property_key = 4;
  string property_value = 5;
  string link_id = 6;
  string from_id = 7;
  string to_id = 8;
  string relation = 9;
}

message EvaluateScenarioRequest {
  string namespace = 1;
  // current (default). Temporal as-of is reserved and rejected in this vertical.
  string base_mode = 2;
  // Reserved for future temporal as-of base; ignored when base_mode=current.
  int64 valid_at_ms = 3;
  int64 recorded_revision = 4;
  repeated string seed_object_ids = 5;
  repeated ScenarioDelta deltas = 6;
  // Retrieval-class bounds (0 = defaults; values above hard max are capped).
  uint32 max_depth = 7;
  uint32 max_objects = 8;
  uint32 max_links = 9;
  uint32 max_time_ms = 10;
  uint64 max_explanation_bytes = 11;
  // Scenario-specific caps.
  uint32 max_deltas = 12;
  uint32 max_expansion_work_units = 13;
  string request_id = 14;
}

message ScenarioImpactRow {
  // object | link | property
  string target_kind = 1;
  string object_id = 2;
  string link_id = 3;
  string property_key = 4;
  // set_property | remove_property | add_link | remove_link
  string op = 5;
  repeated string delta_ids = 6;
  repeated string explanation_steps = 7;
  string before_value = 8;
  string after_value = 9;
}

message EvaluateScenarioResponse {
  // Always "hypothesis". Distinct from fact / evidence / forecast.
  string epistemic_class = 1;
  // Ephemeral correlation id for this request-scoped evaluation.
  string scenario_id = 2;
  string base_mode = 3;
  string namespace = 4;
  repeated ScenarioImpactRow impact_rows = 5;
  bool truncated = 6;
  // Non-sensitive bound names only (deltas, objects, links, time, ...).
  repeated string truncation_reasons = 7;
  uint32 expansion_work_units = 8;
  uint32 applied_deltas = 9;
}

// Semantic catalog capabilities (#151). These are discoverable through
// DiscoverCapabilities and invokable with the #107 receipt-attributed binding
// (x-sekai-capability, x-sekai-namespace, x-sekai-operation-id). Natural-
// language planning and summarization remain outside Sekai.
message ResolveSemanticRefRequest {
  string namespace = 1;
  // Exactly one of the following reference fields must be set.
  string object_id = 2;
  string external_id = 3;
  string ontology_class = 4;
  string ontology_relation = 5;
}

message ResolveSemanticRefResponse {
  // object | ontology_class | ontology_relation | unavailable
  string ref_kind = 1;
  Object object = 2;
  OntologyClass ontology_class = 3;
  OntologyRelation ontology_relation = 4;
  string ontology_revision = 5;
  // False when the reference is absent or not authorized for the caller.
  // Absence and denial are intentionally indistinguishable.
  bool resolved = 6;
}

message ExpandRelationsRequest {
  string namespace = 1;
  ContextRoot root = 2;
  repeated string relations = 3;
  string direction = 4; // outgoing | incoming | both; empty defaults to both
  string reasoning_mode = 5; // empty/asserted_only | entailment
  uint32 max_depth = 6; // 0 is roots-only; values above 3 are capped
  uint32 max_objects = 7; // 0 defaults to 20; absolute cap is 100
  uint32 max_links = 8; // 0 defaults to 40 when expanding; cap is 200
  repeated string kind_filter = 9;
  uint32 max_source_rows = 10; // 0 defaults to 200; cap is 1000
  uint32 max_derived_rows = 11; // 0 defaults to 100; cap is 500
  uint32 max_derivation_steps = 12; // 0 defaults to 12; cap is 32
  uint32 max_time_ms = 13; // 0 defaults to 100; cap is 1000
  uint64 max_explanation_bytes = 14; // 0 defaults to 1 MiB; cap is 16 MiB
}

message ExpandRelationsResponse {
  repeated ContextCandidate candidates = 1;
  repeated Link links = 2;
  bool truncated = 3;
  uint32 unresolved_roots = 4;
  uint32 denied_objects = 5;
  uint32 truncated_objects = 6;
  uint32 truncated_links = 7;
  repeated string truncation_reasons = 8;
  uint32 source_rows = 9;
  uint32 derived_rows = 10;
  string ontology_revision = 11;
  string reasoning_mode = 12;
}

message ExplainDerivationRequest {
  string namespace = 1;
  ContextRoot from = 2;
  ContextRoot to = 3;
  repeated string relations = 4;
  string direction = 5; // outgoing | incoming | both; empty defaults to both
  string reasoning_mode = 6; // empty/asserted_only | entailment
  uint32 max_depth = 7;
  uint32 max_objects = 8;
  uint32 max_links = 9;
  uint32 max_source_rows = 10;
  uint32 max_derived_rows = 11;
  uint32 max_derivation_steps = 12;
  uint32 max_time_ms = 13;
  uint64 max_explanation_bytes = 14;
}

message ExplainDerivationResponse {
  ContextExplanation explanation = 1;
  bool found = 2;
  bool truncated = 3;
  repeated string truncation_reasons = 4;
  string ontology_revision = 5;
  string reasoning_mode = 6;
  // Opaque evidence references (source fact ids). Never secrets or tokens.
  repeated string evidence_refs = 7;
}

