  optional uint64 source_sequence = 11;
}

enum SourceDeliveryMode {
  SOURCE_DELIVERY_MODE_UNSPECIFIED = 0;
  SOURCE_DELIVERY_MODE_SNAPSHOT = 1;
  SOURCE_DELIVERY_MODE_CHANGE_FEED = 2;
}

// Replay-relevant ordered-delivery metadata for sekai.source-batch/v2.
message SourceDeliveryWindow {
  SourceDeliveryMode mode = 1;
  uint64 sync_generation = 2;
  optional string source_feed_epoch = 3;
  // Exclusive lower bound for change-feed delivery.
  optional uint64 offset_start = 4;
  // Inclusive upper bound for change-feed delivery, or the handoff barrier
  // when snapshot_complete is true.
  optional uint64 offset_end = 5;
  bool snapshot_complete = 6;
}

message SourceBatch {
  string contract_version = 1;
  string namespace = 2;
  // Rebound to the single authenticated transport principal by the server.
  string producer_identity = 3;
  string source = 4;
  string source_instance = 5;
  string family = 6;
  string adapter_id = 7;
  string adapter_version = 8;
  string type_digest = 9;
  string current_cursor = 10;
  string proposed_next_cursor = 11;
  string idempotency_key = 12;
  string batch_digest = 13;
  int64 collected_at_ms = 14;
  repeated SourceRecord records = 15;
  SourceDeliveryWindow delivery = 16;
}

message SourceBinding {
  string binding_id = 1;
  string namespace = 2;
  string producer_identity = 3;
  string source = 4;
  string source_instance = 5;
  string family = 6;
  string adapter_id = 7;
  string adapter_version = 8;
  string type_digest = 9;
  int64 created_at_ms = 10;
  bool active = 11;
}

message SourceBatchTransaction {
  string transaction_id = 1;
  string binding_id = 2;
  string namespace = 3;
  string producer_identity = 4;
  string idempotency_key = 5;
  string batch_digest = 6;
  string current_cursor = 7;
  string proposed_next_cursor = 8;
  string status = 9; // OPEN | COMMITTED | ABORTED | QUARANTINED
  string outcome = 10; // success | denial | unavailable | partial | unknown
  int64 opened_at_ms = 11;
  optional int64 closed_at_ms = 12;
  string reason = 13;
  string contract_version = 14;
  SourceDeliveryMode delivery_mode = 15;
  optional uint64 sync_generation = 16;
  optional string source_feed_epoch = 17;
  optional uint64 offset_start = 18;
  optional uint64 offset_end = 19;
  optional bool snapshot_complete = 20;
}

message SourceCheckpoint {
  string binding_id = 1;
  string namespace = 2;
  string cursor = 3;
  string committed_batch_digest = 4;
  int64 advanced_at_ms = 5;
  string contract_version = 6;
  SourceDeliveryMode delivery_mode = 7;
  optional uint64 sync_generation = 8;
  optional string source_feed_epoch = 9;
  optional uint64 committed_offset = 10;
}

message SyncedObject {
