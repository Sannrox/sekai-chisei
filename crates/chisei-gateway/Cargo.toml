[package]
name = "chisei-gateway"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Governed OpenAI- and Anthropic-compatible egress gateway."

[features]
default = []
secret-command = ["sekai-domain/secret-command"]

[dependencies]
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
pin-project-lite = "0.2"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sekai-admin-client = { version = "1.0.0", path = "../sekai-admin-client" }
sekai-domain = { version = "1.1.0", path = "../sekai-domain" }
sekai-obs = { version = "1.1.0", path = "../sekai-obs" }
sekai-proto = { version = "1.2.0", path = "../sekai-proto" }
sekai-provider = { version = "1.0.0", path = "../sekai-provider" }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sekai-chisei = { version = "1.2.0", path = "../..", features = ["gateway-test-support"] }
tempfile = "3"
