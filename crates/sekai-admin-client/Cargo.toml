[package]
name = "sekai-admin-client"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Provider-neutral administration client for Sekai Chisei."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chisei-provider = { version = "1.0.0", path = "../chisei-provider" }
sekai-domain = { version = "1.1.0", path = "../sekai-domain" }
sekai-proto = { version = "1.3.0", path = "../sekai-proto" }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "net",
    "rt",
    "time",
] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
sekai-chisei = { version = "1.3.0", path = "../..", features = ["gateway-test-support"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
