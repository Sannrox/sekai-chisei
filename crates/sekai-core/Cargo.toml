[package]
name = "sekai-core"
version = "1.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Durable Sekai graph, audit, lineage, security, coordination, and persistence."
repository = "https://github.com/Sannrox/sekai-chisei"

[features]
default = []
gateway-test-support = []

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
fs2 = "0.4.3"
hmac = "0.12"
metrics = "0.24"
mikura = { git = "https://github.com/Sannrox/mikura", rev = "0d43c57df9ddc4de62ecd1b3ad53932766b10124" }
mikura-ingest = { git = "https://github.com/Sannrox/mikura", rev = "0d43c57df9ddc4de62ecd1b3ad53932766b10124" }
native-tls = "0.2"
postgres = { version = "0.19", default-features = false, features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
] }
postgres-native-tls = "0.5"
r2d2 = "0.8"
r2d2_postgres = "0.18"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "limits"] }
same-file = "1"
sekai-domain = { version = "1.1.0", path = "../sekai-domain" }
sekai-obs = { version = "1.1.0", path = "../sekai-obs" }
sekai-ontology = { version = "1.0.0", path = "../sekai-ontology" }
sekai-source-sdk = { version = "1.3.0", path = "../sekai-source-sdk" }
sekai-types = { version = "1.0.0", path = "../sekai-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["trace"] }
mikura-host = { git = "https://github.com/Sannrox/mikura", rev = "0d43c57df9ddc4de62ecd1b3ad53932766b10124" }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
] }
