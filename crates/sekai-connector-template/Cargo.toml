[package]
name = "sekai-connector-template"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Source connector template generated by `sekaictl admin connectors new`."
publish = false

[dependencies]
sekai-proto = { version = "1.1.0", path = "../sekai-proto" }
sekai-source-sdk = { version = "1.3.0", path = "../sekai-source-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
