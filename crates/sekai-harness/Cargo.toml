[package]
name = "sekai-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Benchmark, soak, and conformance drivers for the Sekai Chisei control plane."
repository = "https://github.com/Sannrox/sekai-chisei"

# Drivers sit above the root crate: editing one rebuilds only this crate, and
# the root library no longer carries their public surface.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.24"
sekai-chisei = { path = "../.." }
sekai-source-sdk = { version = "2.0.0", path = "../sekai-source-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
tonic = { version = "0.14", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "control_plane"
harness = false
