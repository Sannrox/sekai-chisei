[package]
name = "sekai-types"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Stable Sekai values shared by the control plane and store."

[dependencies]
base64 = "0.23"
hmac = "0.12"
sekai-domain = { version = "1.1.0", path = "../sekai-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
