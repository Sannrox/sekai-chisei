apiVersion: v1
kind: Service
metadata:
  name: sekai-chisei
  labels:
    app: sekai-chisei
spec:
  selector:
    app: sekai-chisei
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: ops
      port: 9464
      targetPort: ops
    - name: http
      port: 50080
      targetPort: http
