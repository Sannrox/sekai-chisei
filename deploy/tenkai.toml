# tenkai product manifest for sekai-chisei itself.
#
# Deploys a *workload* instance (separate from the control-plane instance
# tenkai talks to): gRPC on 50052, ops/healthz on 9465, data in a named
# volume. Runs on Apple `container`; commands are self-contained (no repo
# checkout needed), so this manifest can be published straight from a git tag.
#
# Release flow: bump product.version, the image tag, and the compatibility
# profile below together, commit, tag the repo `v<version>`. The release
# workflow pushes the image to GHCR.

[product]
name = "sekai-chisei"
version = "2.0.2"
description = "sekai-chisei control plane (workload instance via Apple container)"

[deploy]
workdir = "."
install = """
set -e
IMG=ghcr.io/sannrox/sekai-chisei:v2.0.2
container image pull "$IMG" || container image inspect "$IMG" >/dev/null 2>&1
container volume create sekai-chisei-prod-data >/dev/null 2>&1 || true
container run --rm --user root -v sekai-chisei-prod-data:/data "$IMG" chown -R sekai /data
container rm -f sekai-chisei-prod >/dev/null 2>&1 || true
# Explicit dest-pair matches compose (docs/docker.md). Image SEKAI_DATA_DIR=/data derives the same files.
# Plaintext on 0.0.0.0 is confined to the container VM; ports publish to localhost only.
container run -d --name sekai-chisei-prod -p 50052:50051 -p 9465:9464 -e SEKAI_INSECURE=1 -e SEKAI_BIND=0.0.0.0 -e SEKAI_ALLOW_PLAINTEXT=1 -e OPS_BIND=0.0.0.0 -e SEKAI_DB_PATH=/data/sekai.db -e CHISEI_DB_PATH=/data/chisei.db -v sekai-chisei-prod-data:/data "$IMG"
"""
uninstall = "container rm -f sekai-chisei-prod"
health = """
for i in $(seq 1 15); do
  curl -sf http://127.0.0.1:9465/healthz >/dev/null 2>&1 && exit 0
  sleep 1
done
exit 1
"""

# Contracts this release provides to dependents (Tenkai profile v2), as its
# compatibility.json lists them. The pin is a digest of the release version.
# A version or contract bump refreshes this block: `sekaictl admin
# compatibility check-tenkai` prints it, and CI refuses a stale one.
[compatibility]
version = 2
# Evidence binds one release digest; one day is Tenkai's maximum.
max_evidence_age_ms = 86400000

[compatibility.components.sekai-chisei.pin]
kind = "digest"
value = "sha256:e66d46c2132cc9041fe7bbf5b24fa23a63f372e1920ca1548e5d426db6fbed4e"

[compatibility.components.sekai-chisei.provides]
"chisei.admin-rpc" = "1.0.0"
"chisei.enterprise-rpc" = "1.0.0"
